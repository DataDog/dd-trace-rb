require:
  - ./rubocop/custom_cops
  - standard
  - standard-custom
  - standard-performance
  - rubocop-performance

inherit_gem:
  standard: config/base.yml
  standard-custom: config/base.yml
  standard-performance: config/base.yml

AllCops:
  TargetRubyVersion: 2.5
  Exclude:
    - appraisal/**/**
    - gemfiles/**/**
    - integration/**/**
    - lib/datadog/**/vendor/**/*
    - lib/datadog/profiling/ext/exec_monkey_patch.rb
    - vendor/bundle/**/*
    - "*.rb" # test files at the root
  NewCops: disable
  SuggestExtensions: false

# Prevent direct ENV usage in library code.
CustomCops/EnvUsageCop:
  Enabled: true
  Description: 'Prevents direct usage of ENV to access environment variables'
  SafeAutoCorrect: false
  Include:
    - "lib/**/*"
  Exclude:
    - "lib/datadog/core/configuration/config_helper.rb"
    - "lib/datadog/core/configuration/deprecations.rb"

# Enforce consistent exception logging format.
CustomCops/ExceptionMessageCop:
  Enabled: true
  Description: 'Enforces consistent exception logging format: use `e.message` instead of bare `#{e}` interpolation, `e.class` instead of `e.class.name`, and require `#{e.class}` alongside any exception interpolation'
  SafeAutoCorrect: false
  Include:
    - "lib/**/*"

# Keep private type documentation in mirrored RBS signatures instead of duplicating it in YARD.
CustomCops/PrivateYardTypeCop:
  Enabled: true
  Description: 'Prevents private YARD type tags from restating mirrored RBS signatures'
  Include:
    - "lib/**/*"
  # Pre-existing offenses carved out at introduction time can be cleaned up incrementally.
  Exclude:
    - "lib/datadog/core/utils/network.rb"
    - "lib/datadog/data_streams/pathway_context.rb"
    - "lib/datadog/di.rb"
    - "lib/datadog/di/el/compiler.rb"
    - "lib/datadog/di/probe_notification_builder.rb"
    - "lib/datadog/di/probe_notifier_worker.rb"
    - "lib/datadog/di/serializer.rb"
    - "lib/datadog/opentelemetry/sdk/trace/span.rb"
    - "lib/datadog/symbol_database/component.rb"
    - "lib/datadog/symbol_database/extractor.rb"
    - "lib/datadog/symbol_database/remote.rb"
    - "lib/datadog/symbol_database/scope_batcher.rb"
    - "lib/datadog/symbol_database/uploader.rb"
    - "lib/datadog/tracing/contrib/component.rb"
    - "lib/datadog/tracing/contrib/graphql/unified_trace.rb"
    - "lib/datadog/tracing/contrib/pg/instrumentation.rb"
    - "lib/datadog/tracing/distributed/baggage.rb"
    - "lib/datadog/tracing/distributed/trace_context.rb"
    - "lib/datadog/tracing/span.rb"
    - "lib/datadog/tracing/span_operation.rb"
    - "lib/datadog/tracing/trace_operation.rb"
    - "lib/datadog/tracing/tracer.rb"
    - "lib/datadog/tracing/transport/native.rb"
    - "lib/datadog/tracing/transport/span_events_negotiation.rb"

# Validate environment variable strings against the supported configurations.
CustomCops/EnvStringValidationCop:
  Enabled: true
  Description: 'Prevents usage of environment variables that are not in the allowed list'
  Safe: false
  Include:
    - "lib/**/*"
  Exclude:
    - "lib/datadog/core/configuration/supported_configurations.rb"

# Prevent direct Time.now usage in library code; Datadog::Core::Utils::Time.now
# captures the original (non-monkey-patched) implementation once at load time,
# so all callers observe a consistent, dependable current time.
CustomCops/TimeNowUsageCop:
  Enabled: true
  Description: 'Prevents direct usage of Time.now; use Datadog::Core::Utils::Time.now instead'
  SafeAutoCorrect: false
  Include:
    - "lib/**/*"
  Exclude:
    # This file defines Utils::Time.now itself, by aliasing the original ::Time.now.
    - "lib/datadog/core/utils/time.rb"

# The trailing-comma and leading-comment cops below should stay in sync with
# .standard_todo.yml's "**/**" ignore list so it stays clear which tool is
# enforcing each cop.

# Keep method-call commas disabled while their style remains under discussion.
Style/TrailingCommaInArguments:
  Enabled: false

# Require a comma in array and hash literals when the closing delimiter is on
# its own line.

Style/TrailingCommaInArrayLiteral:
  EnforcedStyleForMultiline: diff_comma

Style/TrailingCommaInHashLiteral:
  EnforcedStyleForMultiline: diff_comma

# standard requires a space after '#', which breaks Steep inline annotations (`#:`, `#$`).
# We can drop this override if https://github.com/standardrb/standard/pull/820 is merged
# and released with AllowSteepAnnotation enabled in standard's base config.
Layout/LeadingCommentSpace:
  Enabled: true
  AllowSteepAnnotation: true

# standard disables this cop entirely. We still want it enforced under lib/, since we
# support Rubies below 3.4 for years to come.
Style/FrozenStringLiteralComment:
  Enabled: true
  # The default EnforcedStyle (always) also accepts `# frozen_string_literal: false`.
  # We need the comment to be true, not merely present.
  EnforcedStyle: always_true
  Include:
    - "lib/**/*.rb"
