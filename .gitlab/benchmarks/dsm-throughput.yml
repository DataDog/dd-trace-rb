# DSM overhead benchmark: runs benchmarks/kafka_dsm via the benchmarking-platform
# branch ruby/data-streams-monitoring, against this pipeline's checkout.
stages:
  - benchmarks

workflow:
  auto_cancel:
    on_new_commit: interruptible

variables:
  DSM_THROUGHPUT_CI_IMAGE: 486234852809.dkr.ecr.us-east-1.amazonaws.com/ci/benchmarking-platform:dd-trace-rb-dsm
  DSM_BENCHMARKING_BRANCH: ruby/data-streams-monitoring

dsm_throughput:
  stage: benchmarks
  needs: []
  tags: ["runner:apm-k8s-same-cpu"]
  image: $DSM_THROUGHPUT_CI_IMAGE
  timeout: 1h
  rules:
    - if: $CI_COMMIT_REF_NAME == "master"
      interruptible: false
    - interruptible: true
  retry:
    max: 2
    when:
      - unknown_failure
      - data_integrity_failure
      - runner_system_failure
      - scheduler_failure
      - api_failure
  script:
    - |
      if ! git clone --branch "${DSM_BENCHMARKING_BRANCH}" https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.ddbuild.io/DataDog/benchmarking-platform platform; then
        echo "Error: Failed to clone benchmarking-platform repository (branch ${DSM_BENCHMARKING_BRANCH})" >&2
        exit 1
      fi
    - cd platform
    - bp-runner bp-runner.yml --debug
  artifacts:
    name: "artifacts"
    when: always
    paths:
      - platform/artifacts/
    expire_in: 3 months
  variables:
    KUBERNETES_SERVICE_ACCOUNT_OVERWRITE: dd-trace-rb
    FF_USE_LEGACY_KUBERNETES_EXECUTION_STRATEGY: "true"
    # Tracer and workload come from this pipeline's checkout (path gem); libdatadog_api is compiled by run.sh.
    DD_TRACE_RB_SRC_DIR: "${CI_PROJECT_DIR}"
