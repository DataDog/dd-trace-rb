name: dd-apm-sdk-review
version: "0.1"

# One file on purpose: the platform CLI errors if suites/ has more than one YAML.
# One starter case. Copy the block to add the next one.
cases:
  - id: rb-conventions-env-and-time
    files:
      - AGENTS.md
      - .agents/skills/dd-apm-sdk-review/reviewers/conventions.md
      - .agents/skills/dd-apm-sdk-review/reviewers/_common.md
      - .agents/dd-apm-sdk-review-overrides/reviewers/conventions.md
    input: |
      Apply this repo's conventions-review criteria (reviewers/conventions.md, its
      .agents/dd-apm-sdk-review-overrides/reviewers/conventions.md override, _common.md, and
      AGENTS.md) to the following code. No git checkout available — this snippet is the
      entire change to review. Treat the snippet as
      `lib/datadog/tracing/contrib/http/instrumentation.rb` starting at line 10 (shipped
      code, not a spec).

      ```ruby
      def service_name
        ENV['DD_SERVICE'] || 'unnamed'
      end

      def started_at
        Time.now
      end
      ```
    expected_criteria:
      - "Flags `ENV['DD_SERVICE']` — shipped code must read environment variables through `DATADOG_ENV`, not `ENV` directly."
      - "Flags `Time.now` — shipped code must use `Datadog::Core::Utils::Time.now` so tests can override the provider."
      - "Names the concrete replacements, not just 'avoid ENV' / 'avoid Time.now'."
    bad_signals:
      - "Approves the `ENV` read or the `Time.now` call."
      - "Treats both as style nits with no repo-specific reason."
      - "Invents a different wrapper name that this gem does not use."
