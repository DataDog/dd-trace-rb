name: Test macOS

on: # yamllint disable-line rule:truthy
  push:
    branches:
      - master
  pull_request:

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: "${{ github.ref != 'refs/heads/master' }}"

# Default permissions for all jobs
permissions: {}

jobs:
  gate:
    uses: ./.github/workflows/_deps_gate.yml

  test-macos:
    needs: gate
    if: ${{ needs.gate.outputs.proceed == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-15
        ruby:
          # ADD NEW RUBIES HERE
          - version: '4.0'
            rubygems: '3.7.2'
          - version: '3.4'
            rubygems: '3.7.2'
          - version: '3.3'
            rubygems: '3.7.2'
          - version: '3.2'
            rubygems: '3.7.2'
          - version: '3.1'
            rubygems: '3.6.9'
          - version: '3.0'
            rubygems: '3.5.23'
    name: Test (${{ matrix.os }}, ${{ matrix.ruby.version }})
    runs-on: ${{ matrix.os }}
    env:
      SKIP_SIMPLECOV: 1
      DD_INSTRUMENTATION_TELEMETRY_ENABLED: false
      DD_REMOTE_CONFIGURATION_ENABLED: false
      DATADOG_GEM_CI: true
      DD_PROFILING_MACOS_TESTING: true
      BUNDLE_GEMFILE: gemfiles/ruby-${{ matrix.ruby.version }}.gemfile
      BUNDLE_FROZEN: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # bundler appears to match both prerelease and release rubies when we
      # want the former only. relax the constraint to allow any version for
      # head rubies
      - if: ${{ matrix.ruby.version == 'head' }}
        run: sed -i~ -e '/spec\.required_ruby_version/d' datadog.gemspec
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: ${{ matrix.ruby.version }}
      - name: Install rubygems
        run: gem update --system ${{ matrix.ruby.rubygems }}
      - name: Get ruby information
        run: |
          which ruby
          ruby --version
          which gem
          gem --version
          which bundle
          bundle --version
      - name: Install dependencies
        run: bundle install
      - name: Run specs
        run: bundle exec rake spec:core_with_libdatadog_api spec:main spec:profiling

  complete:
    name: Test macOS (complete)
    runs-on: ubuntu-24.04
    needs:
      - test-macos
    steps:
      - run: echo "DONE!"
