name: "Update Latest Dependency"

on: # yamllint disable-line rule:truthy
  schedule:
    - cron: '0 0 * * 0' # Every Sunday at midnight
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

# Default permissions for all jobs
permissions: {}

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        engine:
          # ADD NEW RUBIES HERE
          - name: ruby
            version: '4.0'
          - name: ruby
            version: '3.4'
          - name: ruby
            version: '3.3'
          - name: ruby
            version: '3.2'
          - name: ruby
            version: '3.1'
          - name: ruby
            version: '3.0'
          - name: ruby
            version: '2.7'
          - name: ruby
            version: '2.6'
          - name: ruby
            version: '2.5'
    container:
      image: ghcr.io/datadog/images-rb/engines/${{ matrix.engine.name }}:${{ matrix.engine.version }}-gnu-gcc-g77e33a123652958f60eee85c431b66ca946bd666
      env:
        BUNDLE_GEMFILE: gemfiles/${{ matrix.engine.name }}-${{ matrix.engine.version }}.gemfile
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Bundle
        run: bundle install
      - name: Ensure parent lockfile platforms
        run: bundle lock --add-platform x86_64-linux aarch64-linux arm64-darwin x86_64-darwin
      - name: Update (parent level)
        run: bundle update
      - name: Update (child level)
        run: bundle exec rake edge:gemspec edge:update
      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: 'gha${{ github.run_id }}-datadog-gem-${{ matrix.engine.name }}-${{ matrix.engine.version }}'
          path: |
            gemfiles/${{ matrix.engine.name }}-${{ matrix.engine.version }}.gemfile.lock
            gemfiles/${{ matrix.engine.name }}_${{ matrix.engine.version }}_*
          retention-days: 1

  aggregate:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download artifacts for all runtimes
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: gemfiles
          pattern: gha${{ github.run_id }}-datadog-gem-*
          merge-multiple: true

      # Use dd-octo-sts (not GITHUB_TOKEN) so the PR opens with a token that
      # triggers downstream workflows. lock-dependency.yml must fire on this PR
      # for `dependency:propagate` to run; PRs created with GITHUB_TOKEN do not
      # dispatch workflows, so swapping the token would silently break propagation.
      - name: Get GitHub Token via dd-octo-sts
        id: generate-token
        uses: DataDog/dd-octo-sts-action@c85802a58e202b7e764b5441e4378c76043c8108 # v1.0.5
        with:
          scope: DataDog/dd-trace-rb
          policy: self.update-latest-dependency

      - name: Create Pull Request
        uses: $/.github/actions/signed-commit-pr
        with:
          token: ${{ steps.generate-token.outputs.token }}
          branch: auto-generate/update-latest-dependencies
          title: '[🤖] Update Latest Dependency'
          base: master
          labels: dev/internal, integrations
          commit-message: "[🤖] Update Latest Dependency: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          add-paths: gemfiles
          body: |
            ### Why

            Routine maintenance: the test matrix must keep testing the newest dependency releases. This PR refreshes the latest-dependency gemfiles.

            ### What

            Regenerates gemfiles/ from the latest versions of the tracked dependencies.

            ### Risk

            Two-way door, test-only lockfiles. Revert restores the previous gemfiles.

            ### Details

            Reviewer action: merge when CI is green, or close it and let the next run refresh the PR.

            <details><summary>Automation</summary>

            _Auto-generated by [update-latest-dependency](https://github.com/DataDog/dd-trace-rb/blob/master/.github/workflows/update-latest-dependency.yml). The PR is continually updated with new changes until it is merged or closed._

            </details>
