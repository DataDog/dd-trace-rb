name: Claude Hook Tests

on: # yamllint disable-line rule:truthy
  pull_request:
    paths:
      - '.claude/hooks/**'

permissions: {}

jobs:
  test:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: "4.0.1"
          bundler: none
      - name: Cache Spinel build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/spinel
          key: spinel-${{ runner.os }}-${{ hashFiles('.claude/hooks/Makefile') }}
      - name: Compile hooks and run tests
        working-directory: .claude/hooks
        run: make
