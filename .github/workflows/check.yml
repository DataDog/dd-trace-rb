name: Static Analysis

on: # yamllint disable-line rule:truthy
  push:
    branches:
      - master
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/master' && github.run_id || github.ref }}
  cancel-in-progress: true

# Default permissions for all jobs
permissions: {}

jobs:
  build:
    name: build
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/datadog/images-rb/engines/ruby:4.0-gnu-gcc-g6cd77b11e598a108c8a13dda1398462cf05d5080
      env:
        BUNDLE_GEMFILE: gemfiles/ruby-4.0.gemfile
        BUNDLE_FROZEN: "true"
    outputs:
      lockfile: ${{ steps.bundle-cache.outputs.lockfile }}
      cache-key: ${{ steps.bundle-cache.outputs.cache-key }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare bundle cache
        id: bundle-cache
        uses: ./.github/actions/bundle-cache

  standard:
    name: standard/lint
    runs-on: ubuntu-24.04
    needs: ['build']
    container:
      image: ghcr.io/datadog/images-rb/engines/ruby:4.0-gnu-gcc-g6cd77b11e598a108c8a13dda1398462cf05d5080
      env:
        BUNDLE_GEMFILE: gemfiles/ruby-4.0.gemfile
        BUNDLE_FROZEN: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Restore bundle cache
        uses: ./.github/actions/bundle-restore
        with:
          lockfile: ${{ needs.build.outputs.lockfile }}
          cache-key: ${{ needs.build.outputs.cache-key }}
      - run: bundle exec rubocop -D
      - run: bundle exec rake standard

  rubocop:
    name: rubocop/lint
    runs-on: ubuntu-24.04
    needs: ['build']
    container:
      image: ghcr.io/datadog/images-rb/engines/ruby:4.0-gnu-gcc-g6cd77b11e598a108c8a13dda1398462cf05d5080
      env:
        BUNDLE_GEMFILE: gemfiles/ruby-4.0.gemfile
        BUNDLE_FROZEN: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Restore bundle cache
        uses: ./.github/actions/bundle-restore
        with:
          lockfile: ${{ needs.build.outputs.lockfile }}
          cache-key: ${{ needs.build.outputs.cache-key }}
      - run: bundle exec rake rubocop

  steep:
    name: steep/typecheck
    runs-on: ubuntu-24.04
    needs: ['build']
    container:
      image: ghcr.io/datadog/images-rb/engines/ruby:4.0-gnu-gcc-g6cd77b11e598a108c8a13dda1398462cf05d5080
      env:
        BUNDLE_GEMFILE: gemfiles/ruby-4.0.gemfile
        BUNDLE_FROZEN: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Restore bundle cache
        uses: ./.github/actions/bundle-restore
        with:
          lockfile: ${{ needs.build.outputs.lockfile }}
          cache-key: ${{ needs.build.outputs.cache-key }}
      - name: Check for stale signature files
        run: bundle exec rake rbs:stale
      - name: Check for missing signature files
        run: bundle exec rake rbs:missing
      - name: Check types
        run: bundle exec rake steep:check
      - name: Record stats
        run: bundle exec rake steep:stats[md] >> "$GITHUB_STEP_SUMMARY"

  bundler-audit:
    name: bundler-audit
    runs-on: ubuntu-24.04
    needs: ['build']
    container:
      image: ghcr.io/datadog/images-rb/engines/ruby:4.0-gnu-gcc-g6cd77b11e598a108c8a13dda1398462cf05d5080
      env:
        BUNDLE_GEMFILE: gemfiles/ruby-4.0.gemfile
        BUNDLE_FROZEN: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Restore bundle cache
        uses: ./.github/actions/bundle-restore
        with:
          lockfile: ${{ needs.build.outputs.lockfile }}
          cache-key: ${{ needs.build.outputs.cache-key }}
      - run: bundle exec rake dependency:audit
      - name: Link to fix instructions
        if: failure()
        env:
          DOC_URL: ${{ github.server_url }}/${{ github.repository }}/blob/${{ github.sha }}/docs/DevelopmentGuide.md#dependency-audit-bundler-audit
        run: |
          if [ -f tmp/dependency_audit_findings.json ]; then
            echo "::error::See $DOC_URL for how to reproduce this locally and how to fix or document a CVE finding."
          fi

  changelog:
    name: changelog/check
    runs-on: ubuntu-24.04
    needs: ['build']
    container:
      image: ghcr.io/datadog/images-rb/engines/ruby:4.0-gnu-gcc-g6cd77b11e598a108c8a13dda1398462cf05d5080
      env:
        BUNDLE_GEMFILE: gemfiles/ruby-4.0.gemfile
        BUNDLE_FROZEN: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Restore bundle cache
        uses: ./.github/actions/bundle-restore
        with:
          lockfile: ${{ needs.build.outputs.lockfile }}
          cache-key: ${{ needs.build.outputs.cache-key }}

      - name: Configure Git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
        shell: bash

      - name: Check CHANGELOG.md is only changed by release PRs
        if: github.event_name == 'pull_request'
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: .github/scripts/check_changelog_release_only.sh

      - name: Validate changelog fragment schema
        run: bundle exec rake unreleased:lint

      - name: Install vale
        env:
          VALE_VERSION: "3.20.0"
          VALE_SHA256: f59e7030c5d4ace6cf915497d0d076a1699d61e876142765963237e6867c9712
        run: .github/scripts/install_vale.sh

      - name: Install vale style packages
        env:
          WRITE_GOOD_VERSION: "0.4.1"
          WRITE_GOOD_SHA256: 2960ef10861ddc7dc76292a4967eb3789bf05ca24f862042f6d15f53332887f0
          PROSELINT_VERSION: "0.3.4"
          PROSELINT_SHA256: 48b1fb481ba44f6505d44346b283f6cdc74efd234f913bbdb09bf34420fab81c
          HARPER_VERSION: "0.1.0"
          HARPER_SHA256: bfab282e7abd8906f8656c240ccd4d873679878ed8e0c42d683ad7e2798c436c
        run: .github/scripts/install_vale_styles.sh

      - name: Lint changelog fragment messages
        run: bundle exec rake unreleased:vale

      - name: Render changelog fragments
        run: bundle exec rake unreleased:render

  checksum-coverage:
    name: checksum-coverage
    runs-on: ubuntu-24.04
    needs: ['build']
    container:
      image: ghcr.io/datadog/images-rb/engines/ruby:4.0-gnu-gcc-g6cd77b11e598a108c8a13dda1398462cf05d5080
      env:
        BUNDLE_GEMFILE: gemfiles/ruby-4.0.gemfile
        BUNDLE_FROZEN: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Restore bundle cache
        uses: ./.github/actions/bundle-restore
        with:
          lockfile: ${{ needs.build.outputs.lockfile }}
          cache-key: ${{ needs.build.outputs.cache-key }}
      - run: bundle exec rake dependency:checksum_coverage

  semgrep:
    name: semgrep/ci
    runs-on: ubuntu-24.04
    container: semgrep/semgrep:1.169.0 # PENDING: Possible to be rate limited.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: |
          semgrep ci \
          --include=bin/* \
          --include=ext/* \
          --include=lib/* \
          --exclude-rule=ruby.lang.security.model-attributes-attr-accessible.model-attributes-attr-accessible
        env:
          SEMGREP_RULES: p/default

  zizmor:
    name: zizmor
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Get GitHub Token via dd-octo-sts
        id: generate-token
        uses: DataDog/dd-octo-sts-action@96a25462dbcb10ebf0bfd6e2ccc917d2ab235b9a # v1.0.4
        with:
          scope: DataDog/dd-trace-rb
          policy: self.check
      - name: Run zizmor
        uses: zizmorcore/zizmor-action@3dc1ecc9bcb9e94e9b2c709687979e1298497054 # v0.6.2
        with:
          version: 1.26.1
          min-severity: low
          advanced-security: false
          token: ${{ steps.generate-token.outputs.token }}

  actionlint:
    name: actionlint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run actionlint
        env:
          ACTIONLINT_IMAGE: rhysd/actionlint@sha256:96d4a8c87dbbfb3bdd324f8fdc285fc3df5261e2decc619a4dd7e8ee52bbfd46 # 1.7.8
        run: |
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/repo:ro" \
            --workdir /repo \
            "$ACTIONLINT_IMAGE" \
            -color

  yaml-lint:
    name: yaml-lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: pip install yamllint
      - name: Run yamllint
        run: yamllint --strict .

  complete:
    name: Static Analysis (complete)
    needs:
      - 'steep'
      - 'standard'
      - 'rubocop'
      - 'semgrep'
      - 'zizmor'
      - 'actionlint'
      - 'yaml-lint'
      - 'checksum-coverage'
      - 'bundler-audit'
      - 'changelog'
    runs-on: ubuntu-24.04
    steps:
      - run: echo "Done"
