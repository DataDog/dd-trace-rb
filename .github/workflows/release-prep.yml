name: Prepare release

# Prepares a release PR for a new version:
#   1. Validates the version (release_prep:validate)
#   2. Renders the unreleased/ changelog fragments into the GitHub release
#      body (release_prep:release_body)
#   3. Creates the draft GitHub release for tag vX.Y.Z (gh release create --draft)
#   4. Writes the changelog into CHANGELOG.md and rewrites the compare-link
#      footer (release_prep:changelog)
#   5. Regenerates docs/integration_versions.md and docs/integration_versions.json
#   6. Bumps the gem version (version:bump: lib/datadog/version.rb, gemfiles, tools/*.lock)
#   7. Opens a `release`-labelled PR targeting master
#
# The draft release is created by step 3; nothing needs to be hand-created
# or pre-approved beforehand. This workflow does not publish.
on: # yamllint disable-line rule:truthy
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, without the v prefix (e.g. 2.36.0)"
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.event.inputs.version }}
  cancel-in-progress: false

# Default permissions for all jobs
permissions: {}

jobs:
  prepare-release:
    name: Prepare the release PR
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    env:
      BUNDLE_GEMFILE: gemfiles/ruby-4.0.gemfile
      BUNDLE_FROZEN: "true"
    steps:
      - name: Get GitHub Token via dd-octo-sts
        id: generate-token
        uses: DataDog/dd-octo-sts-action@96a25462dbcb10ebf0bfd6e2ccc917d2ab235b9a # v1.0.4
        with:
          scope: DataDog/dd-trace-rb
          policy: self.release-prep

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true # required for `git` operations in later steps
          token: ${{ steps.generate-token.outputs.token }}

      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: "4.0.1"

      - run: bundle install

      - name: Validate version
        env:
          VERSION: ${{ inputs.version }}
        run: bundle exec rake "release_prep:validate[${VERSION}]"

      - name: Render release body
        env:
          VERSION: ${{ inputs.version }}
        run: bundle exec rake "release_prep:release_body[${VERSION}]"

      - name: Create draft release
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
          VERSION: ${{ inputs.version }}
        run: |
          if gh release view "v${VERSION}" >/dev/null 2>&1; then
            echo "::error::A release for v${VERSION} already exists; delete it before retrying"
            exit 1
          fi
          gh release create "v${VERSION}" --draft --title "v${VERSION}" --notes-file tmp/release_body.md

      - name: Update CHANGELOG.md
        env:
          VERSION: ${{ inputs.version }}
        run: bundle exec rake "release_prep:changelog[${VERSION}]"

      # version:bump rewrites gemfiles/*.lock, which requires an unfrozen bundle.
      - name: Bump version
        env:
          VERSION: ${{ inputs.version }}
          BUNDLE_FROZEN: "false"
        run: bundle exec rake "version:bump[${VERSION}]"

      - name: Update supported integration versions
        run: bundle exec ruby .github/scripts/update_supported_versions.rb

      - name: Create release Pull Request
        uses: ./.github/actions/signed-commit-pr
        with:
          token: ${{ steps.generate-token.outputs.token }}
          branch: bump_to_version_${{ inputs.version }}
          base: master
          title: "Bump to version ${{ inputs.version }}"
          commit-message: "Bump to version ${{ inputs.version }}"
          labels: release
          add-paths: |
            CHANGELOG.md
            docs/integration_versions.md
            docs/integration_versions.json
            lib/datadog/version.rb
            gemfiles
            tools/*.lock
            unreleased
          body: |
            Release preparation for **v${{ inputs.version }}**, generated by the
            [Prepare release](${{ github.server_url }}/${{ github.repository }}/actions/workflows/release-prep.yml) workflow.

            This PR updates `CHANGELOG.md`, `docs/integration_versions.md`, `docs/integration_versions.json`, the gem
            version, and lockfiles. Review and merge to proceed with publishing.

            Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
