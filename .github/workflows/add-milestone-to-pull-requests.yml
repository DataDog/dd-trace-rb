name: Add milestone to merged pull requests

on: # yamllint disable-line rule:truthy
  pull_request_target: # zizmor: ignore[dangerous-triggers] reads merged version data without evaluating Ruby
    types: [closed]

permissions: {}

jobs:
  add_milestone:
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-24.04
    if: github.event.pull_request.merged == true && github.event.pull_request.milestone == null
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.workflow_sha }}
      - uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1.329.0
        with:
          ruby-version: "4.0.1"
          bundler: none

      - name: Get GitHub Token via dd-octo-sts
        id: generate-token
        uses: DataDog/dd-octo-sts-action@c85802a58e202b7e764b5441e4378c76043c8108 # v1.0.5
        with:
          scope: DataDog/dd-trace-rb
          policy: self.add-milestone-to-pull-requests

      - name: Update Pull Request
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: ruby .github/scripts/ci/milestone.rb "$GITHUB_REPOSITORY" "$PR_NUMBER"
