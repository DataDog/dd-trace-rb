# How to configure:
#
# When no team is frozen, set `frozen-teams` to an empty string:
# frozen-teams: ""
#
# When one or more teams are frozen, add them one per line with the @DataDog prefix:
#
# frozen-teams: |
#   @DataDog/team-a
#   @DataDog/team-b
#
# Important note:
# There are dozens of ways to bypass this guard. The goal is to put a red light on PRs that do not comply with
# the code freeze, not to physically prevent people from ignoring that red light. If someone deliberately
# bypasses the guard, it becomes a culture issue rather than a process issue.

name: Team freeze guard

on: # yamllint disable-line rule:truthy
  # Never checks out or executes PR-controlled code; the action only reads
  # PR metadata via the API and runs its own bundled code.
  pull_request_target: # zizmor: ignore[dangerous-triggers]
    types:
      - opened
      - reopened
      - synchronize
      - labeled
      - unlabeled
      - ready_for_review


jobs:
  team-freeze-guard:
    name: Team freeze guard
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: DataDog/team-freeze-guard@d28a2e357903b426122feaae225629bd63fcd2c5  # 0.0.5
        with:
          bypass-labels: |
            dev/ci
            dev/testing
            github_actions
          frozen-teams: ""
