name: "Update Task Weights"

on: # yamllint disable-line rule:truthy
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

# Default permissions for all jobs
permissions: {}

jobs:
  aggregate:
    runs-on: ubuntu-24.04
    permissions:
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@824c0e29fdfc7d689c191c27acc969d2d04b7dd8 # v1.331.0
        with:
          ruby-version: '3.4'

      - name: Download timing artifacts
        run: .github/scripts/download_timing_artifacts.sh timings

      - name: Aggregate task weights
        run: rake -f tasks/github.rake "github:aggregate_timings[$PWD/timings]"

      - name: Upload task weights
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: task-weights
          path: tmp/ci_task_timings.json

  save-cache:
    needs: aggregate
    runs-on: ubuntu-24.04
    permissions:
      actions: read
    # actions/cache versions cache entries by the compression tool available
    # to the runner, and this image has no zstd, so both sides use gzip. The
    # save must happen in the same image the Unit Tests `batch` jobs restore
    # from. Saving from a plain runner (zstd) makes the cache invisible to
    # every gzip-side restore.
    container:
      image: ghcr.io/datadog/images-rb/engines/ruby:3.4-gnu-gcc-g77e33a123652958f60eee85c431b66ca946bd666
    steps:
      - name: Download task weights
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: task-weights
          path: tmp

      - name: Save weights cache
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tmp/ci_task_timings.json
          key: spec-task-weights-${{ github.run_number }}-${{ github.run_attempt }}
