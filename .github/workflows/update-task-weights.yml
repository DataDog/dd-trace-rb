name: "Update Task Weights"

on: # yamllint disable-line rule:truthy
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

# Default permissions for all jobs
permissions: {}

jobs:
  update:
    runs-on: ubuntu-24.04
    permissions:
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
    # Same image as the Unit Tests `batch` jobs: actions/cache derives the cache
    # version from the runner's compression tool, and this image has no zstd.
    # Saving from a plain runner (zstd) made the weights cache invisible to the
    # gzip-side restore in these containers.
    container:
      image: ghcr.io/datadog/images-rb/engines/ruby:3.4-gnu-gcc-g973f248fdbe8a57ba2a5d9930db3821d62b39ced
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install gh CLI
        run: |
          curl -fsSL "https://github.com/cli/cli/releases/download/v2.102.0/gh_2.102.0_linux_amd64.tar.gz" -o /tmp/gh.tar.gz
          tar -xzf /tmp/gh.tar.gz -C /tmp
          install -m 755 /tmp/gh_2.102.0_linux_amd64/bin/gh /usr/local/bin/gh

      - name: Download timing artifacts
        run: .github/scripts/download_timing_artifacts.sh timings

      - name: Aggregate task weights
        run: rake -f tasks/github.rake "github:aggregate_timings[$PWD/timings]"

      - name: Save weights cache
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tmp/ci_task_timings.json
          key: spec-task-weights-${{ github.run_number }}-${{ github.run_attempt }}
