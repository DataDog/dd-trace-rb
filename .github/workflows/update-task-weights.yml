name: "Update Task Weights"

on: # yamllint disable-line rule:truthy
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

# Default permissions for all jobs
permissions: {}

jobs:
  update:
    runs-on: ubuntu-24.04
    permissions:
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@a0102e0972be65f351c307e2d64b9314a57c8073 # v1.324.0
        with:
          ruby-version: '3.4'

      - name: Download timing artifacts
        run: |
          set -eu
          mkdir -p timings
          run_ids="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "Unit Tests" --branch master --status success --limit 5 --json databaseId --jq '.[].databaseId')"
          for run_id in $run_ids; do
            names="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/artifacts" --jq '.artifacts[] | select(.name | startswith("timings-")) | .name')"
            for name in $names; do
              gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --name "$name" --dir "timings/$run_id"
            done
          done

      - name: Aggregate timings
        run: |
          rake -f tasks/github.rake "github:update_task_timings[$PWD/timings]"
          mkdir -p tmp
          cp tasks/ci_task_timings.json tmp/ci_task_timings.json

      - name: Save weights cache
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tmp/ci_task_timings.json
          key: ci-task-weights-${{ github.run_number }}-${{ github.run_attempt }}
