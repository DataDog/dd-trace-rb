name: TEMP Validate signed-commit-pr

# Throwaway workflow used to validate .github/actions/signed-commit-pr against
# the live GitHub API before the composite action is merged. Delete this file
# and the branches it writes to once validation is done.
#
# Uses `on: push` rather than `workflow_dispatch` because a workflow is only
# dispatchable when a version of it carrying that trigger already exists on the
# default branch. Push-triggered workflows run from the pushed ref's own file.
#
# Uses GITHUB_TOKEN rather than dd-octo-sts: every trust policy in
# .github/chainguard pins both subject and job_workflow_ref to
# refs/heads/master, so no token can be minted from a branch. The scopes granted
# below match what the policies grant, so the composite is exercised
# identically; only the token source differs.

on: # yamllint disable-line rule:truthy
  push:
    branches:
      - tonycthsu/validate-signed-commit

permissions: {}

env:
  TARGET_BRANCH: tmp/signed-commit-target
  BASE_BRANCH: tmp/signed-commit-base
  FILE_COUNT: "400"

jobs:
  validate:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The base the pull request targets. A throwaway branch, never master, so
      # a mistake in the composite cannot touch a real branch.
      #
      # Created only when absent, and never moved afterwards. An earlier
      # revision force-PATCHed it to the current HEAD on every run, which
      # retargeted the base under the open pull request and made GitHub close
      # it - one second before the composite's PR step ran, so `gh pr list`
      # found nothing and took the create path again. The base only has to be a
      # stable commit for the target branch to be ahead of; it does not need to
      # track this branch.
      - name: Create throwaway base branch if absent
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          if gh api --silent "repos/$REPO/git/refs/heads/$BASE_BRANCH" 2>/dev/null; then
            echo "$BASE_BRANCH already exists, leaving it where it is."
          else
            gh api --silent -X POST "repos/$REPO/git/refs" \
              -f "ref=refs/heads/$BASE_BRANCH" -f "sha=$(git rev-parse HEAD)"
            echo "Created $BASE_BRANCH."
          fi

      # The target branch is deliberately NOT deleted here. An earlier revision
      # deleted it so step A would exercise the PATCH-fails-then-POST fallback,
      # but that path already passed in run 32017278231 (the 422 for a missing
      # ref is visible in that log). Deleting the branch also makes GitHub
      # auto-close the pull request that points at it, so `gh pr list` found
      # nothing and the composite took its create path - which GITHUB_TOKEN is
      # forbidden from doing. Leaving the branch in place is what allows the
      # update path, and therefore check 3, to be reached at all.

      # ---------------------------------------------------------------
      # Check 2 setup: enough files that the old REST blob-per-file path
      # would be slow. Synthetic, so this does not wait on the 9-Ruby
      # bundle matrix.
      # ---------------------------------------------------------------
      - name: Generate files (run 1)
        run: |
          mkdir -p tmp-validate
          for i in $(seq 1 "$FILE_COUNT"); do
            echo "run 1 content for file $i" > "tmp-validate/file-$i.txt"
          done
          echo "Generated $FILE_COUNT files."

      - name: Record start time
        id: t0
        run: echo "epoch=$(date +%s)" >> "$GITHUB_OUTPUT"

      # Step A: branch absent, PR absent -> creates both.
      - name: A - first commit and PR
        id: run1
        uses: ./.github/actions/signed-commit-pr
        with:
          token: ${{ github.token }}
          branch: ${{ env.TARGET_BRANCH }}
          base: ${{ env.BASE_BRANCH }}
          title: "[TEMP] signed-commit-pr validation"
          body: "Throwaway validation PR. Safe to close and delete."
          labels: dev/internal
          add-paths: tmp-validate
          commit-message: "[TEMP] validation run 1"

      - name: Check 2 - report elapsed time for run 1
        env:
          T0: ${{ steps.t0.outputs.epoch }}
        run: |
          echo "Run 1 (${FILE_COUNT} files) took $(( $(date +%s) - T0 )) seconds."
          echo "changed=${{ steps.run1.outputs.changed }}"
          echo "commit-hash=${{ steps.run1.outputs.commit-hash }}"

      - name: Check 1 - commit is signed and verified
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ steps.run1.outputs.commit-hash }}
        run: |
          verified="$(gh api "repos/$REPO/commits/$SHA" \
            --jq '.commit.verification.verified')"
          reason="$(gh api "repos/$REPO/commits/$SHA" \
            --jq '.commit.verification.reason')"
          echo "verified=$verified reason=$reason"
          if [ "$verified" != "true" ]; then
            echo "FAIL: commit is not verified (reason: $reason)"
            exit 1
          fi
          echo "PASS: commit carries the Verified badge."

      - name: Verify run 1 committed every file
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ steps.run1.outputs.commit-hash }}
        run: |
          # Guards the silent-truncation class of bug: a green run that commits
          # only a subset of the intended files.
          #
          # Counted from the tree, not from `commits/$SHA`.`files`: that array is
          # capped at 300 entries by the REST API, so with FILE_COUNT above 300 it
          # under-reports and this check fails on a correct commit. The tree
          # response carries its own `truncated` flag, asserted below.
          tree="$(gh api "repos/$REPO/git/trees/$SHA?recursive=1")"
          if [ "$(echo "$tree" | jq -r '.truncated')" != "false" ]; then
            echo "FAIL: tree listing was truncated, cannot count reliably"
            exit 1
          fi
          count="$(echo "$tree" \
            | jq '[.tree[] | select(.path | startswith("tmp-validate/"))] | length')"
          echo "files in commit: $count (expected $FILE_COUNT)"
          if [ "$count" -ne "$FILE_COUNT" ]; then
            echo "FAIL: expected $FILE_COUNT files, commit has $count"
            exit 1
          fi
          echo "PASS: all files present in a single commit."

      # ---------------------------------------------------------------
      # Step B: branch and PR now exist -> PATCH path, PR updated, and the
      # branch must still hold exactly one commit on top of base.
      # ---------------------------------------------------------------
      - name: Generate files (run 2)
        run: |
          for i in $(seq 1 "$FILE_COUNT"); do
            echo "run 2 content for file $i" > "tmp-validate/file-$i.txt"
          done

      - name: B - second commit, existing branch and PR
        id: run2
        uses: ./.github/actions/signed-commit-pr
        with:
          token: ${{ github.token }}
          branch: ${{ env.TARGET_BRANCH }}
          base: ${{ env.BASE_BRANCH }}
          title: "[TEMP] signed-commit-pr validation"
          body: "Throwaway validation PR, updated by run 2."
          labels: dev/internal
          add-paths: tmp-validate
          commit-message: "[TEMP] validation run 2"

      # Split deliberately from the pull request assertion below. This is the
      # half that guards the commit-stacking bug class (a reset that runs in the
      # wrong order, or not at all, leaves one commit per run on the branch),
      # and it needs no pull request and no PR-related token scope. Bundling it
      # with the check below would mean a `gh pr edit` permission failure
      # aborted the job before this ever ran.
      - name: Check 3a - branch holds exactly one commit after rerun
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          # Measured against the checked-out SHA, not against $BASE_BRANCH. The
          # composite resets the branch to local HEAD (ghcommit-action's
          # expectedHeadOid is always `git rev-parse HEAD`), so "one commit on
          # top of HEAD" is the actual invariant. Comparing against the base
          # branch conflates a stacked commit with the base simply lagging this
          # branch, which it does now that the base is created once and never
          # moved: that reported ahead_by=2 for a correctly reset branch.
          head_sha="$(git rev-parse HEAD)"
          ahead="$(gh api "repos/$REPO/compare/$head_sha...$TARGET_BRANCH" \
            --jq '.ahead_by')"
          echo "commits ahead of checkout $head_sha: $ahead (expected 1)"
          if [ "$ahead" -ne 1 ]; then
            echo "FAIL: branch should hold exactly 1 commit, holds $ahead"
            gh api "repos/$REPO/compare/$head_sha...$TARGET_BRANCH" \
              --jq '.commits[] | "  \(.sha[0:10]) \(.commit.message | split("\n")[0])"'
            exit 1
          fi
          echo "PASS: rerun reset the branch instead of stacking a commit."

      - name: Check 3b - existing PR updated rather than duplicated
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          open_count="$(gh pr list --repo "$REPO" --head "$TARGET_BRANCH" \
            --base "$BASE_BRANCH" --state open --json number --jq 'length')"
          echo "open PRs for branch: $open_count (expected 1)"
          if [ "$open_count" -ne 1 ]; then
            echo "FAIL: expected exactly 1 open PR, found $open_count"
            exit 1
          fi
          echo "PASS: existing pull request was updated, not duplicated."

      # ---------------------------------------------------------------
      # Step C: nothing changed. Must make no remote changes at all. This is
      # the check that catches the two silent no-op failure modes.
      # ---------------------------------------------------------------
      - name: Record branch head before no-op run
        id: before
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          echo "sha=$(gh api "repos/$REPO/git/refs/heads/$TARGET_BRANCH" \
            --jq '.object.sha')" >> "$GITHUB_OUTPUT"

      - name: C - no-op run, nothing staged
        id: run3
        uses: ./.github/actions/signed-commit-pr
        with:
          token: ${{ github.token }}
          branch: ${{ env.TARGET_BRANCH }}
          base: ${{ env.BASE_BRANCH }}
          title: "[TEMP] signed-commit-pr validation"
          body: "Should not be reached by the no-op run."
          labels: dev/internal
          add-paths: tmp-validate
          commit-message: "[TEMP] validation run 3 (should not exist)"

      - name: Check 4 - zero-change run made no remote changes
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BEFORE: ${{ steps.before.outputs.sha }}
          CHANGED: ${{ steps.run3.outputs.changed }}
        run: |
          echo "changed output: '$CHANGED' (expected 'false')"
          if [ "$CHANGED" != "false" ]; then
            echo "FAIL: expected changed=false on a no-op run"
            exit 1
          fi

          after="$(gh api "repos/$REPO/git/refs/heads/$TARGET_BRANCH" \
            --jq '.object.sha')"
          echo "branch head before=$BEFORE after=$after"
          if [ "$after" != "$BEFORE" ]; then
            echo "FAIL: no-op run moved the branch"
            exit 1
          fi

          ahead="$(gh api "repos/$REPO/compare/$BASE_BRANCH...$TARGET_BRANCH" \
            --jq '.ahead_by')"
          if [ "$ahead" -ne 1 ]; then
            echo "FAIL: no-op run changed commit count to $ahead"
            exit 1
          fi
          echo "PASS: no-op run touched nothing."

      - name: Summary
        run: echo "All four validation checks passed."
