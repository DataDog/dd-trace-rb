name: System Tests

on: # yamllint disable-line rule:truthy
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch: {}
  schedule:
    - cron: "00 04 * * 0-6"

# Default permissions for all jobs
permissions: {}

jobs:
  changes:
    name: Changes
    runs-on: ubuntu-24.04
    outputs:
      changes: ${{ steps.changes.outputs.system_tests }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Changes
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: changes
        with:
          filters: .github/path-filters.yml

  build:
    needs:
      - changes
    if: ${{ needs.changes.outputs.changes == 'true' }}
    runs-on: ubuntu-24.04
    name: Build artifact
    permissions:
      packages: write
    outputs:
      forced_tests: ${{ steps.compute_forced_tests.outputs.forced_tests }}
    steps:
      - name: Checkout DataDog/dd-trace-rb
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: DataDog/dd-trace-rb
          fetch-depth: 2
          persist-credentials: false
          path: packaged/dd-trace-rb
      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dd-trace-rb # The name must match the folder name so it extracts to binaries/dd-trace-rb on download
          path: packaged
      - id: compute_forced_tests
        run: |
          value=$(grep -v -E '^\s*#|^\s*$' packaged/dd-trace-rb/.github/forced-tests-list.cfg | paste -sd ',')
          echo "forced_tests=$value" >> "$GITHUB_OUTPUT"

  test:
    needs:
      - build
    uses: DataDog/system-tests/.github/workflows/system-tests.yml@1f289cff86f5ec2a61502f179ede8960bda417fb  # Automated: Updated by .github/workflows/update-system-tests.yml.
    permissions:
      contents: read
      id-token: write
      packages: write
    with:
      library: ruby
      binaries_artifact: dd-trace-rb
      desired_execution_time: 600
      scenarios_groups: tracer_release
      # system-tests excludes the agentless FFE scenario from tracer_release so that each SDK
      # opts in by naming it (https://github.com/DataDog/system-tests/pull/7298).
      scenarios: FEATURE_FLAGGING_AND_EXPERIMENTATION_AGENTLESS
      ref: 1f289cff86f5ec2a61502f179ede8960bda417fb # Automated: Updated by .github/workflows/update-system-tests.yml.
      force_execute: ${{ needs.build.outputs.forced_tests }}
      parametric_job_count: 8
      push_to_test_optimization: true
      skip_empty_scenarios: true

  complete:
    name: System Tests (complete)
    runs-on: ubuntu-24.04
    needs:
      - test
    steps:
      - run: echo "DONE!"
