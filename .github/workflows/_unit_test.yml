name: Unit Tests (Ruby version specific)

on: # yamllint disable-line rule:truthy
  workflow_call:
    inputs:
      # TODO: Provides concurrency control for each ruby version
      engine:
        required: true
        type: string
      version:
        required: true
        type: string
      alias:
        required: true
        type: string
      package-cache-write:
        required: true
        type: boolean
      installed-matrix-cache:
        required: false
        type: boolean
        default: true
      test-seed:
        required: false
        type: string
        default: ''
    outputs:
      lockfile:
        description: "The lockfile artifact"
        value: ${{ jobs.batch.outputs.lockfile }}
      cache-key:
        description: "The cache key for bundle"
        value: ${{ jobs.batch.outputs.cache-key }}
      package-cache-key:
        description: "The exact downloaded-package cache key"
        value: ${{ jobs.batch.outputs.package-cache-key }}
      installed-cache-key:
        description: "The exact installed matrix bundle cache key"
        value: ${{ jobs.batch.outputs.installed-cache-key }}

  workflow_dispatch:
    inputs:
      engine:
        description: "`ruby`"
        required: true
        type: string
      version:
        description: "The version of the engine (e.g. 2.x, 3.x, 4.x)"
        required: true
        type: string
      alias:
        description: "The alias of the engine (e.g. `ruby-34` for Ruby 3.4)"
        required: true
        type: string
      package-cache-write:
        description: "Permit downloaded-package cache writes on the default branch"
        required: true
        type: boolean
        default: false
      installed-matrix-cache:
        description: "Use the Ruby 4.0 installed-matrix cache experiment"
        required: true
        type: boolean
        default: true
      test-seed:
        description: "Fixed test seed for comparable experimental runs"
        required: false
        type: string
        default: ''

permissions: {}

jobs:
  batch:
    runs-on: ubuntu-24.04
    name: batch
    outputs:
      batches: "${{ steps.set-batches.outputs.batches }}"
      misc: "${{ steps.set-batches.outputs.misc }}"
      cache-key: "${{ steps.bundle-cache.outputs.cache-key || steps.installed-bundle-cache.outputs.cache-key }}"
      lockfile: "${{ steps.bundle-cache.outputs.lockfile }}"
      installed-cache-key: "${{ steps.installed-bundle-cache.outputs.cache-key }}"
      package-cache-key: "${{ steps.package-cache-key.outputs.primary-key }}"
      package-cache-prefix: "${{ steps.package-cache-key.outputs.fallback-prefix }}"
    container:
      image: ghcr.io/datadog/images-rb/engines/${{ inputs.engine }}:${{ inputs.version }}-gnu-gcc-g228e3bfda7544acbb06dacb6021bcceb60cfcb75
      env:
        BUNDLE_GEMFILE: gemfiles/${{ inputs.engine }}-${{ inputs.version }}.gemfile
        BUNDLE_FROZEN: "true"
        BUNDLE_CACHE_ALL: "true"
        BUNDLE_CACHE_PATH: /tmp/ddtrace-bundle-package-cache
        BUNDLE_NO_PRUNE: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare bundle cache
        if: inputs.version != '4.0' || !inputs.installed-matrix-cache
        id: bundle-cache
        uses: ./.github/actions/bundle-cache

      - name: Prepare installed matrix bundle cache
        if: inputs.version == '4.0' && inputs.installed-matrix-cache
        id: installed-bundle-cache
        uses: ./.github/actions/installed-bundle-cache
        with:
          base-gemfile: gemfiles/${{ inputs.engine }}-${{ inputs.version }}.gemfile
          image-identity: ghcr.io/datadog/images-rb/engines/${{ inputs.engine }}:${{ inputs.version }}-gnu-gcc-g228e3bfda7544acbb06dacb6021bcceb60cfcb75

      - name: Report installed matrix bundle cache
        if: inputs.version == '4.0' && inputs.installed-matrix-cache
        shell: bash
        env:
          BYTE_COUNT: ${{ steps.installed-bundle-cache.outputs.byte-count }}
          CACHE_KEY: ${{ steps.installed-bundle-cache.outputs.cache-key }}
          EXACT_HIT: ${{ steps.installed-bundle-cache.outputs.exact-hit }}
          FILE_COUNT: ${{ steps.installed-bundle-cache.outputs.file-count }}
          POPULATION_SECONDS: ${{ steps.installed-bundle-cache.outputs.population-seconds }}
          RESTORE_SECONDS: ${{ steps.installed-bundle-cache.outputs.restore-seconds }}
          SAVE_SECONDS: ${{ steps.installed-bundle-cache.outputs.save-seconds }}
        run: |
          {
            echo "### Installed matrix bundle cache"
            echo "- Key: \`$CACHE_KEY\`"
            echo "- Exact hit: \`${EXACT_HIT:-false}\`"
            echo "- Files: \`$FILE_COUNT\`"
            echo "- Bytes: \`$BYTE_COUNT\`"
            echo "- Restore seconds: \`${RESTORE_SECONDS:-0}\`"
            echo "- Population seconds: \`${POPULATION_SECONDS:-0}\`"
            echo "- Save seconds: \`${SAVE_SECONDS:-0}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - id: set-batches
        name: Distribute tasks into batches
        env:
          FALLBACK_GEMFILE: ${{ inputs.version == '4.0' && format('gemfiles/{0}-{1}.gemfile', inputs.engine, inputs.version) || '' }}
        run: |
          if [ -n "$FALLBACK_GEMFILE" ]; then
            data=$(bundle exec rake "github:generate_batches[$FALLBACK_GEMFILE]")
          else
            data=$(bundle exec rake github:generate_batches)
          fi
          echo "$data" | ruby -rjson -e 'puts JSON.pretty_generate(JSON.parse(STDIN.read))'

          # Extract each key and set it as a separate output
          batches_data=$(echo "$data" | ruby -rjson -e 'puts JSON.parse(STDIN.read)["batches"].to_json')
          misc_data=$(echo "$data" | ruby -rjson -e 'puts JSON.parse(STDIN.read)["misc"].to_json')

          { echo "batches=$batches_data"; echo "misc=$misc_data"; } >> "$GITHUB_OUTPUT"
      - name: Generate batch summary
        env:
          batches_json: "${{ steps.set-batches.outputs.batches }}"
        run: bundle exec rake github:generate_batch_summary

      - id: package-cache-key
        if: inputs.version != '4.0'
        name: Compute and look up package cache key
        uses: ./.github/actions/package-cache-key
        with:
          base-gemfile: gemfiles/${{ inputs.engine }}-${{ inputs.version }}.gemfile
          matrix: Matrixfile
          ruby-version: ${{ inputs.version }}
          runtime-identifier: ${{ inputs.engine }}-${{ inputs.version }}

      - id: package-cache-restore
        if: inputs.version != '4.0' && steps.package-cache-key.outputs.exact-hit != 'true' && inputs.package-cache-write
        name: Restore fallback package cache
        uses: ./.github/actions/package-cache-restore
        with:
          primary-key: ${{ steps.package-cache-key.outputs.primary-key }}
          fallback-prefix: ${{ steps.package-cache-key.outputs.fallback-prefix }}

      - id: package-cache-populate
        if: inputs.version != '4.0' && steps.package-cache-key.outputs.exact-hit != 'true' && inputs.package-cache-write
        name: Populate package cache
        uses: ./.github/actions/package-cache-populate
        with:
          manifest-path: ${{ steps.package-cache-key.outputs.manifest-path }}

      - id: package-cache-save
        if: inputs.version != '4.0' && steps.package-cache-key.outputs.exact-hit != 'true' && inputs.package-cache-write
        name: Save package cache
        uses: ./.github/actions/package-cache-save
        with:
          primary-key: ${{ steps.package-cache-key.outputs.primary-key }}
          write-enabled: ${{ inputs.package-cache-write }}

      - name: Report package cache preparation
        if: inputs.version != '4.0'
        shell: bash
        env:
          BYTE_COUNT: ${{ steps.package-cache-populate.outputs.byte-count }}
          DOWNLOADED_BYTES: ${{ steps.package-cache-populate.outputs.downloaded-byte-count }}
          DOWNLOADED_FILES: ${{ steps.package-cache-populate.outputs.downloaded-file-count }}
          EXACT_HIT: ${{ steps.package-cache-key.outputs.exact-hit }}
          FILE_COUNT: ${{ steps.package-cache-populate.outputs.file-count }}
          MATCHED_KEY: ${{ steps.package-cache-restore.outputs.matched-key || steps.package-cache-key.outputs.matched-key }}
          POPULATE_SECONDS: ${{ steps.package-cache-populate.outputs.duration-seconds }}
          PRIMARY_KEY: ${{ steps.package-cache-key.outputs.primary-key }}
          RESTORE_SECONDS: ${{ steps.package-cache-restore.outputs.duration-seconds }}
          SAVE_SECONDS: ${{ steps.package-cache-save.outputs.duration-seconds }}
        run: |
          {
            echo "### Downloaded package cache"
            echo "- Primary key: \`$PRIMARY_KEY\`"
            echo "- Matched key: \`${MATCHED_KEY:-none}\`"
            echo "- Exact hit: \`${EXACT_HIT:-false}\`"
            echo "- Archive files: \`${FILE_COUNT:-not-downloaded}\`"
            echo "- Archive bytes: \`${BYTE_COUNT:-not-downloaded}\`"
            echo "- Downloaded files: \`${DOWNLOADED_FILES:-0}\`"
            echo "- Downloaded bytes: \`${DOWNLOADED_BYTES:-0}\`"
            echo "- Restore seconds: \`${RESTORE_SECONDS:-0}\`"
            echo "- Population seconds: \`${POPULATE_SECONDS:-0}\`"
            echo "- Save seconds: \`${SAVE_SECONDS:-0}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # `Initialize containers` step becomes quite heavily when many services are used.
  #
  # The job can failed with timeout because it takes a long time pulling the image or waiting for the service to be ready).
  #
  # `build-test-standard` job is used to run most of our tasks and configured with the following services:
  #   - mysql
  #   - postgres
  #   - redis
  #
  # `build-test-misc` job is extracted to run specific tasks that requires the following services:
  #   - elasticsearch
  #   - memcached
  #   - mongodb
  #   - opensearch
  #   - presto
  #
  #  Benefit of this optimization:
  #  - Unnecessary services are not started
  #  - Reduce the overhead for pulling images
  #  - Improve reliability for starting dependent services
  #
  # In the future, we could consider to extract jobs to run database dependent tasks to optimize the workflow.
  build-test-standard:
    needs:
      - batch
    runs-on: ubuntu-24.04
    name: build & test (standard) [${{ matrix.batch }}]
    timeout-minutes: 30
    env:
      BATCHED_TASKS: "${{ toJSON(matrix.tasks) }}"
    strategy:
      fail-fast: false
      matrix:
        include: "${{ fromJson(needs.batch.outputs.batches).include }}"
    container:
      image: ghcr.io/datadog/images-rb/engines/${{ inputs.engine }}:${{ inputs.version }}-gnu-gcc-g228e3bfda7544acbb06dacb6021bcceb60cfcb75
      env:
        BUNDLE_GEMFILE: gemfiles/${{ inputs.engine }}-${{ inputs.version }}.gemfile
        BUNDLE_FROZEN: "true"
        BUNDLE_CACHE_ALL: "true"
        BUNDLE_CACHE_PATH: /tmp/ddtrace-bundle-package-cache
        BUNDLE_NO_PRUNE: "true"
        # Resolve every dynamic symbol at load time, so that a native extension referencing a symbol Ruby does not
        # export fails here instead of in a customer's image (https://github.com/DataDog/dd-trace-rb/issues/6338)
        LD_BIND_NOW: "1"
        DD_INSTRUMENTATION_TELEMETRY_ENABLED: "false"
        DD_REMOTE_CONFIGURATION_ENABLED: "false"
        TEST_POSTGRES_HOST: postgres
        TEST_REDIS_HOST: redis
        TEST_MYSQL_HOST: mysql
        DD_AGENT_HOST: agent
        DD_TRACE_AGENT_PORT: "9126"
        OTLP_GRPC_PORT: "4317"
        OTLP_HTTP_PORT: "4318"
        DATADOG_GEM_CI: "true"
        TEST_DATADOG_INTEGRATION: "1"
    services:
      agent:
        # Pinned by digest for https://github.com/DataDog/dd-apm-test-agent/pull/410
        # Switch to the v1.66.0 tag once it is released.
        image: ghcr.io/datadog/dd-apm-test-agent/ddapm-test-agent@sha256:67a560e0dbd928534e6d680362a5407d382acc263cb976c4a7a294070abfba26
        env:
          LOG_LEVEL: DEBUG
          TRACE_LANGUAGE: ruby
          PORT: "9126"
          OTLP_GRPC_PORT: "4317"
          OTLP_HTTP_PORT: "4318"
          DD_POOL_TRACE_CHECK_FAILURES: "true"
          DD_DISABLE_ERROR_RESPONSES: "true"
          ENABLED_CHECKS: trace_content_length,trace_stall,meta_tracer_version_header,trace_count_header,trace_peer_service,trace_dd_service
      mysql:
        image: ghcr.io/datadog/images-rb/services/mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_PASSWORD: mysql
          MYSQL_USER: mysql
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      postgres:
        image: ghcr.io/datadog/images-rb/services/postgres:9.6
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: ghcr.io/datadog/images-rb/services/redis:6.2
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Restore bundle cache
        if: inputs.version != '4.0' || !inputs.installed-matrix-cache
        uses: ./.github/actions/bundle-restore
        with:
          lockfile: ${{ needs.batch.outputs.lockfile }}
          cache-key: ${{ needs.batch.outputs.cache-key }}
      - id: installed-bundle-restore
        if: inputs.version == '4.0' && inputs.installed-matrix-cache
        name: Restore installed matrix bundle
        uses: ./.github/actions/installed-bundle-restore
        with:
          cache-key: ${{ needs.batch.outputs.installed-cache-key }}
      - name: Report installed matrix bundle restore
        if: inputs.version == '4.0' && inputs.installed-matrix-cache
        shell: bash
        env:
          RESTORE_SECONDS: ${{ steps.installed-bundle-restore.outputs.restore-seconds }}
        run: |
          {
            echo "### Installed matrix bundle restore"
            echo "- Exact hit: \`true\`"
            echo "- Restore seconds: \`$RESTORE_SECONDS\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - id: package-cache-restore
        if: inputs.version != '4.0'
        name: Restore package cache
        uses: ./.github/actions/package-cache-restore
        with:
          primary-key: ${{ needs.batch.outputs.package-cache-key }}
          fallback-prefix: ${{ needs.batch.outputs.package-cache-prefix }}
      - name: Report package cache restore
        if: inputs.version != '4.0'
        shell: bash
        env:
          EXACT_HIT: ${{ steps.package-cache-restore.outputs.exact-hit }}
          MATCHED_KEY: ${{ steps.package-cache-restore.outputs.matched-key }}
          RESTORE_SECONDS: ${{ steps.package-cache-restore.outputs.duration-seconds }}
        run: |
          {
            echo "### Downloaded package cache restore"
            echo "- Matched key: \`${MATCHED_KEY:-none}\`"
            echo "- Exact hit: \`${EXACT_HIT:-false}\`"
            echo "- Restore seconds: \`${RESTORE_SECONDS:-0}\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Build & Test
        uses: ./.github/actions/build-test
        with:
          alias: ${{ inputs.alias }}
          container-id: "standard-${{ matrix.batch }}"
          test-seed: ${{ inputs.test-seed }}

  build-test-misc:
    needs:
      - batch
    runs-on: ubuntu-24.04
    name: build & test (misc) [${{ matrix.batch }}]
    timeout-minutes: 30
    env:
      BATCHED_TASKS: "${{ toJSON(matrix.tasks) }}"
    strategy:
      fail-fast: false
      matrix:
        include: "${{ fromJson(needs.batch.outputs.misc).include }}"
    container:
      image: ghcr.io/datadog/images-rb/engines/${{ inputs.engine }}:${{ inputs.version }}-gnu-gcc-g228e3bfda7544acbb06dacb6021bcceb60cfcb75
      env:
        BUNDLE_GEMFILE: gemfiles/${{ inputs.engine }}-${{ inputs.version }}.gemfile
        BUNDLE_FROZEN: "true"
        BUNDLE_CACHE_ALL: "true"
        BUNDLE_CACHE_PATH: /tmp/ddtrace-bundle-package-cache
        BUNDLE_NO_PRUNE: "true"
        LD_BIND_NOW: "1" # See above
        DD_INSTRUMENTATION_TELEMETRY_ENABLED: "false"
        DD_REMOTE_CONFIGURATION_ENABLED: "false"
        TEST_ELASTICSEARCH_HOST: elasticsearch
        TEST_MEMCACHED_HOST: memcached
        TEST_MONGODB_HOST: mongodb
        TEST_MONGODB_SECONDARY_HOST: mongodb_secondary
        TEST_OPENSEARCH_HOST: opensearch
        TEST_OPENSEARCH_PORT: "9200"
        TEST_PRESTO_HOST: presto
        DD_AGENT_HOST: agent
        DD_TRACE_AGENT_PORT: "9126"
        DATADOG_GEM_CI: "true"
        TEST_DATADOG_INTEGRATION: "1"
      options: --link mongodb:mongodb_secondary
    services:
      agent:
        # Pinned by digest for https://github.com/DataDog/dd-apm-test-agent/pull/410
        # Switch to the v1.66.0 tag once it is released.
        image: ghcr.io/datadog/dd-apm-test-agent/ddapm-test-agent@sha256:67a560e0dbd928534e6d680362a5407d382acc263cb976c4a7a294070abfba26
        env:
          LOG_LEVEL: DEBUG
          TRACE_LANGUAGE: ruby
          PORT: "9126"
          OTLP_GRPC_PORT: "4317"
          OTLP_HTTP_PORT: "4318"
          DD_POOL_TRACE_CHECK_FAILURES: "true"
          DD_DISABLE_ERROR_RESPONSES: "true"
          ENABLED_CHECKS: trace_content_length,trace_stall,meta_tracer_version_header,trace_count_header,trace_peer_service,trace_dd_service
      elasticsearch:
        image: elasticsearch:8.19.11
        env:
          discovery.type: single-node
          xpack.security.enabled: "false"
          ES_JAVA_OPTS: "-Xms750m -Xmx750m"
        options: >-
          --health-cmd "curl -sf http://localhost:9200/_cluster/health | grep -qE '\"status\":\"(green|yellow)\"' || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      memcached:
        image: ghcr.io/datadog/images-rb/services/memcached:1.6-alpine
      mongodb:
        image: ghcr.io/datadog/images-rb/services/mongo:4.4
      opensearch:
        image: ghcr.io/datadog/images-rb/services/opensearchproject/opensearch:2.8.0
        env:
          discovery.type: single-node
          DISABLE_SECURITY_PLUGIN: "true"
          DISABLE_PERFORMANCE_ANALYZER_AGENT_CLI: "true"
          cluster.routing.allocation.disk.watermark.low: 3gb
          cluster.routing.allocation.disk.watermark.high: 2gb
          cluster.routing.allocation.disk.watermark.flood_stage: 1gb
          cluster.routing.allocation.disk.threshold_enabled: "false"
      presto:
        image: ghcr.io/datadog/images-rb/services/starburstdata/presto:332-e.9
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Restore bundle cache
        if: inputs.version != '4.0' || !inputs.installed-matrix-cache
        uses: ./.github/actions/bundle-restore
        with:
          lockfile: ${{ needs.batch.outputs.lockfile }}
          cache-key: ${{ needs.batch.outputs.cache-key }}
      - id: installed-bundle-restore
        if: inputs.version == '4.0' && inputs.installed-matrix-cache
        name: Restore installed matrix bundle
        uses: ./.github/actions/installed-bundle-restore
        with:
          cache-key: ${{ needs.batch.outputs.installed-cache-key }}
      - name: Report installed matrix bundle restore
        if: inputs.version == '4.0' && inputs.installed-matrix-cache
        shell: bash
        env:
          RESTORE_SECONDS: ${{ steps.installed-bundle-restore.outputs.restore-seconds }}
        run: |
          {
            echo "### Installed matrix bundle restore"
            echo "- Exact hit: \`true\`"
            echo "- Restore seconds: \`$RESTORE_SECONDS\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - id: package-cache-restore
        if: inputs.version != '4.0'
        name: Restore package cache
        uses: ./.github/actions/package-cache-restore
        with:
          primary-key: ${{ needs.batch.outputs.package-cache-key }}
          fallback-prefix: ${{ needs.batch.outputs.package-cache-prefix }}
      - name: Report package cache restore
        if: inputs.version != '4.0'
        shell: bash
        env:
          EXACT_HIT: ${{ steps.package-cache-restore.outputs.exact-hit }}
          MATCHED_KEY: ${{ steps.package-cache-restore.outputs.matched-key }}
          RESTORE_SECONDS: ${{ steps.package-cache-restore.outputs.duration-seconds }}
        run: |
          {
            echo "### Downloaded package cache restore"
            echo "- Matched key: \`${MATCHED_KEY:-none}\`"
            echo "- Exact hit: \`${EXACT_HIT:-false}\`"
            echo "- Restore seconds: \`${RESTORE_SECONDS:-0}\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Build & Test
        uses: ./.github/actions/build-test
        with:
          alias: ${{ inputs.alias }}
          container-id: "misc-${{ matrix.batch }}"
          test-seed: ${{ inputs.test-seed }}
