name: Unit Tests (Ruby version specific)

on: # yamllint disable-line rule:truthy
  workflow_call:
    inputs:
      # TODO: Provides concurrency control for each ruby version
      engine:
        required: true
        type: string
      version:
        required: true
        type: string
      alias:
        required: true
        type: string

  workflow_dispatch:
    inputs:
      engine:
        description: "`ruby`"
        required: true
        type: string
      version:
        description: "The version of the engine (e.g. 2.x, 3.x, 4.x)"
        required: true
        type: string
      alias:
        description: "The alias of the engine (e.g. `ruby-34` for Ruby 3.4)"
        required: true
        type: string

permissions: {}

env:
  CACHE_VERSION: ${{ vars.CACHE_VERSION }}

jobs:
  batch:
    runs-on: ubuntu-24.04
    name: batch
    outputs:
      batches: "${{ steps.set-batches.outputs.batches }}"
      misc: "${{ steps.set-batches.outputs.misc }}"
      cache-key: "${{ steps.bundle-matrix-cache.outputs.cache-key }}"
      cache-match: "${{ steps.bundle-matrix-cache.outputs.cache-match }}"
    container:
      image: &engine-image ghcr.io/datadog/images-rb/engines/${{ inputs.engine }}:${{ inputs.version }}-gnu-gcc-g973f248fdbe8a57ba2a5d9930db3821d62b39ced
      env:
        BUNDLE_GEMFILE: gemfiles/${{ inputs.engine }}-${{ inputs.version }}.gemfile
        BUNDLE_FROZEN: "true"
    steps:
      - &checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: set-batches
        name: Distribute tasks into batches
        run: |
          data=$(rake -f tasks/github.rake github:generate_batches)
          echo "$data" | ruby -rjson -e 'puts JSON.pretty_generate(JSON.parse(STDIN.read))'

          batches_data=$(echo "$data" | ruby -rjson -e 'puts JSON.parse(STDIN.read)["batches"].to_json')
          misc_data=$(echo "$data" | ruby -rjson -e 'puts JSON.parse(STDIN.read)["misc"].to_json')
          gemfiles_data=$(echo "$data" | ruby -rjson -e 'puts JSON.parse(STDIN.read)["gemfiles"].to_json')

          {
            echo "batches=$batches_data"
            echo "misc=$misc_data"
            echo "gemfiles=$gemfiles_data"
          } >> "$GITHUB_OUTPUT"

      - name: Generate batch summary
        env:
          batches_json: "${{ steps.set-batches.outputs.batches }}"
        run: rake -f tasks/github.rake github:generate_batch_summary

      - name: Prepare matrix bundle
        id: bundle-matrix-cache
        uses: ./.github/actions/bundle-matrix-cache
        with:
          image: *engine-image
          gemfiles: ${{ steps.set-batches.outputs.gemfiles }}

  # `Initialize containers` step becomes quite heavily when many services are used.
  #
  # The job can failed with timeout because it takes a long time pulling the image or waiting for the service to be ready).
  #
  # `build-test-standard` job is used to run most of our tasks and configured with the following services:
  #   - mysql
  #   - postgres
  #   - redis
  #
  # `build-test-misc` job is extracted to run specific tasks that requires the following services:
  #   - elasticsearch
  #   - memcached
  #   - mongodb
  #   - opensearch
  #   - presto
  #
  #  Benefit of this optimization:
  #  - Unnecessary services are not started
  #  - Reduce the overhead for pulling images
  #  - Improve reliability for starting dependent services
  #
  # In the future, we could consider to extract jobs to run database dependent tasks to optimize the workflow.
  build-test-standard:
    needs:
      - batch
    runs-on: ubuntu-24.04
    name: build & test (standard) [${{ matrix.batch }}]
    timeout-minutes: 30
    env:
      BATCHED_TASKS: "${{ toJSON(matrix.tasks) }}"
    strategy:
      fail-fast: false
      matrix:
        include: "${{ fromJson(needs.batch.outputs.batches).include }}"
    container:
      image: *engine-image
      env:
        BUNDLE_GEMFILE: gemfiles/${{ inputs.engine }}-${{ inputs.version }}.gemfile
        BUNDLE_FROZEN: "true"
        # Resolve every dynamic symbol at load time, so that a native extension referencing a symbol Ruby does not
        # export fails here instead of in a customer's image (https://github.com/DataDog/dd-trace-rb/issues/6338)
        LD_BIND_NOW: "1"
        DD_INSTRUMENTATION_TELEMETRY_ENABLED: "false"
        DD_REMOTE_CONFIGURATION_ENABLED: "false"
        TEST_POSTGRES_HOST: postgres
        TEST_REDIS_HOST: redis
        TEST_MYSQL_HOST: mysql
        DD_AGENT_HOST: agent
        DD_TRACE_AGENT_PORT: "9126"
        OTLP_GRPC_PORT: "4317"
        OTLP_HTTP_PORT: "4318"
        DATADOG_GEM_CI: "true"
        TEST_DATADOG_INTEGRATION: "1"
    services:
      agent:
        # Pinned by digest for https://github.com/DataDog/dd-apm-test-agent/pull/410
        # Switch to the v1.66.0 tag once it is released.
        image: ghcr.io/datadog/dd-apm-test-agent/ddapm-test-agent@sha256:67a560e0dbd928534e6d680362a5407d382acc263cb976c4a7a294070abfba26
        env:
          LOG_LEVEL: DEBUG
          TRACE_LANGUAGE: ruby
          PORT: "9126"
          OTLP_GRPC_PORT: "4317"
          OTLP_HTTP_PORT: "4318"
          DD_POOL_TRACE_CHECK_FAILURES: "true"
          DD_DISABLE_ERROR_RESPONSES: "true"
          ENABLED_CHECKS: trace_content_length,trace_stall,meta_tracer_version_header,trace_count_header,trace_peer_service,trace_dd_service
      mysql:
        image: ghcr.io/datadog/images-rb/services/mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_PASSWORD: mysql
          MYSQL_USER: mysql
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      postgres:
        image: ghcr.io/datadog/images-rb/services/postgres:9.6
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: ghcr.io/datadog/images-rb/services/redis:6.2
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - *checkout
      - &restore-bundle
        name: Restore bundle cache
        id: restore-bundle
        uses: ./.github/actions/bundle-restore
        with:
          key: ${{ needs.batch.outputs.cache-key }}
      - &require-exact-matrix-cache
        name: Require exact matrix cache hit
        id: require-exact-matrix-cache
        if: needs.batch.outputs.cache-match == 'matrix' && steps.restore-bundle.outputs.cache-outcome != 'exact'
        run: |
          echo "::warning::Matrix cache restore mismatch; rebuilding dependencies locally."
          # Passing core reuses existing dependencies and installs missing dependencies for this worker's batch Gemfiles.
          # The same tests run.
          echo "cache-match=core" >> "$GITHUB_OUTPUT"
      - &install-core-dependencies
        name: Install core dependencies
        if: needs.batch.outputs.cache-match == 'partial' || steps.restore-bundle.outputs.cache-outcome != 'exact'
        run: bundle check || bundle install
      - &build-test
        name: Build & Test
        uses: ./.github/actions/build-test
        with:
          alias: ${{ inputs.alias }}
          container-id: ${{ matrix.container-id }}
          cache-match: ${{ steps.require-exact-matrix-cache.outputs.cache-match || needs.batch.outputs.cache-match }}

  build-test-misc:
    needs:
      - batch
    runs-on: ubuntu-24.04
    name: build & test (misc) [${{ matrix.batch }}]
    timeout-minutes: 30
    env:
      BATCHED_TASKS: "${{ toJSON(matrix.tasks) }}"
    strategy:
      fail-fast: false
      matrix:
        include: "${{ fromJson(needs.batch.outputs.misc).include }}"
    container:
      image: *engine-image
      env:
        BUNDLE_GEMFILE: gemfiles/${{ inputs.engine }}-${{ inputs.version }}.gemfile
        BUNDLE_FROZEN: "true"
        LD_BIND_NOW: "1" # See above
        DD_INSTRUMENTATION_TELEMETRY_ENABLED: "false"
        DD_REMOTE_CONFIGURATION_ENABLED: "false"
        TEST_ELASTICSEARCH_HOST: elasticsearch
        TEST_MEMCACHED_HOST: memcached
        TEST_MONGODB_HOST: mongodb
        TEST_MONGODB_SECONDARY_HOST: mongodb_secondary
        TEST_OPENSEARCH_HOST: opensearch
        TEST_OPENSEARCH_PORT: "9200"
        TEST_PRESTO_HOST: presto
        DD_AGENT_HOST: agent
        DD_TRACE_AGENT_PORT: "9126"
        DATADOG_GEM_CI: "true"
        TEST_DATADOG_INTEGRATION: "1"
      options: --link mongodb:mongodb_secondary
    services:
      agent:
        # Pinned by digest for https://github.com/DataDog/dd-apm-test-agent/pull/410
        # Switch to the v1.66.0 tag once it is released.
        image: ghcr.io/datadog/dd-apm-test-agent/ddapm-test-agent@sha256:67a560e0dbd928534e6d680362a5407d382acc263cb976c4a7a294070abfba26
        env:
          LOG_LEVEL: DEBUG
          TRACE_LANGUAGE: ruby
          PORT: "9126"
          OTLP_GRPC_PORT: "4317"
          OTLP_HTTP_PORT: "4318"
          DD_POOL_TRACE_CHECK_FAILURES: "true"
          DD_DISABLE_ERROR_RESPONSES: "true"
          ENABLED_CHECKS: trace_content_length,trace_stall,meta_tracer_version_header,trace_count_header,trace_peer_service,trace_dd_service
      elasticsearch:
        image: elasticsearch:8.19.11
        env:
          discovery.type: single-node
          xpack.security.enabled: "false"
          ES_JAVA_OPTS: "-Xms750m -Xmx750m"
        options: >-
          --health-cmd "curl -sf http://localhost:9200/_cluster/health | grep -qE '\"status\":\"(green|yellow)\"' || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      memcached:
        image: ghcr.io/datadog/images-rb/services/memcached:1.6-alpine
      mongodb:
        image: ghcr.io/datadog/images-rb/services/mongo:4.4
      opensearch:
        image: ghcr.io/datadog/images-rb/services/opensearchproject/opensearch:2.8.0
        env:
          discovery.type: single-node
          DISABLE_SECURITY_PLUGIN: "true"
          DISABLE_PERFORMANCE_ANALYZER_AGENT_CLI: "true"
          cluster.routing.allocation.disk.watermark.low: 3gb
          cluster.routing.allocation.disk.watermark.high: 2gb
          cluster.routing.allocation.disk.watermark.flood_stage: 1gb
          cluster.routing.allocation.disk.threshold_enabled: "false"
      presto:
        image: ghcr.io/datadog/images-rb/services/starburstdata/presto:332-e.9
    steps:
      - *checkout
      - *restore-bundle
      - *require-exact-matrix-cache
      - *install-core-dependencies
      - *build-test
