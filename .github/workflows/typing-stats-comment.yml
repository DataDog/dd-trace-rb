name: Publish typing statistics

on: # yamllint disable-line rule:truthy
  workflow_run: # zizmor: ignore[dangerous-triggers] uses only verified run metadata; no artefact extraction
    workflows: [Typing statistics]
    types: [completed]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.head_repository.id }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  comment:
    name: typing-stats/comment
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      pull-requests: read
      id-token: write
    # workflow_run checks attach to master; reporting errors must not block its validation.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        id: checkout
        continue-on-error: true
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1.329.0
        id: ruby
        continue-on-error: true
        with:
          ruby-version: "4.0.1"
          bundler: none
      - name: Verify report provenance
        id: report
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: ruby .github/scripts/ci/typing_comment.rb verify "$GITHUB_REPOSITORY" "$GITHUB_EVENT_PATH" "$GITHUB_OUTPUT"
      - name: Get GitHub Token via dd-octo-sts
        id: generate-token
        continue-on-error: true
        if: steps.report.outputs.ready == 'true'
        uses: DataDog/dd-octo-sts-action@c85802a58e202b7e764b5441e4378c76043c8108 # v1.0.5
        with:
          scope: DataDog/dd-trace-rb
          policy: self.typing-stats
      - name: Publish report link
        id: publish
        continue-on-error: true
        if: steps.report.outputs.ready == 'true' && steps.generate-token.outcome == 'success'
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
        run: ruby .github/scripts/ci/typing_comment.rb publish "$GITHUB_REPOSITORY" "$GITHUB_EVENT_PATH"
      - name: Report publishing failure
        if: always() && contains(join(steps.*.outcome, ','), 'failure')
        run: echo "::warning::Typing statistics could not be published; see the producer's run summary and artefact."
