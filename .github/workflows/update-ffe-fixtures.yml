name: Update FFE fixtures

on: # yamllint disable-line rule:truthy
  schedule:
    - cron: '0 0 * * 0' # Every Sunday at midnight UTC
  workflow_dispatch:
    inputs:
      fixture_ref:
        description: Branch, tag, or commit from DataDog/ffe-system-test-data
        required: true
        default: main
        type: string

concurrency:
  group: update-ffe-fixtures
  cancel-in-progress: false

permissions: {}

jobs:
  update-ffe-fixtures:
    if: github.repository == 'DataDog/dd-trace-rb' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Update fixture snapshot
        id: fixtures
        env:
          FFE_FIXTURE_REF: ${{ inputs.fixture_ref || 'main' }}
        run: ruby tasks/ffe_fixtures.rb --ref "$FFE_FIXTURE_REF"

      - uses: DataDog/dd-octo-sts-action@c85802a58e202b7e764b5441e4378c76043c8108 # v1.0.5
        if: steps.fixtures.outputs.changed == 'true'
        id: octo-sts
        with:
          scope: DataDog/dd-trace-rb
          policy: self.update-ffe-fixtures

      - name: Check for an open fixture update PR
        if: steps.fixtures.outputs.changed == 'true'
        id: existing-pr
        env:
          GH_TOKEN: ${{ steps.octo-sts.outputs.token }}
        run: |
          count=$(gh pr list --repo "$GITHUB_REPOSITORY" \
            --head auto-generate/update-ffe-fixtures --state open \
            --json number --jq 'length')
          echo "count=$count" >> "$GITHUB_OUTPUT"

      - name: Create Pull Request
        if: >-
          steps.fixtures.outputs.changed == 'true' &&
          steps.existing-pr.outputs.count == '0'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ steps.octo-sts.outputs.token }}
          sign-commits: true
          branch: auto-generate/update-ffe-fixtures
          commit-message: 'test(openfeature): update canonical FFE fixtures'
          base: master
          title: 'test(openfeature): update canonical FFE fixtures'
          draft: true
          labels: dev/internal
          add-paths: spec/datadog/open_feature/ffe-system-test-data
          body: |
            ## Motivation

            Keep Ruby's evaluator aligned with the shared FFE evaluation corpus.

            ## Changes and Decisions

            Update the checked-in snapshot to [${{ steps.fixtures.outputs.source_commit }}](https://github.com/DataDog/ffe-system-test-data/commit/${{ steps.fixtures.outputs.source_commit }}).
            Fix evaluator failures exposed by new cases in this PR before merging; change shared expectations upstream only when they are incorrect.
            Scheduled updates leave an existing update PR untouched to preserve evaluator fixes.

            **Change log entry**
            None.
