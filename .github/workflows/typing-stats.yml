name: Typing statistics

on: # yamllint disable-line rule:truthy
  pull_request:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compute-stats:
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout current branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1.329.0
        with:
          ruby-version: "4.0"
          bundler: none

      - name: Install steep
        # zizmor: ignore[adhoc-packages] pinned tool install for computing typing stats, not an app dependency
        run: gem install steep -v 2.0

      - name: Copy scripts to directory outside of workspace
        run: |
          cp .github/scripts/typing_stats_compute.rb "$RUNNER_TEMP/typing_stats_compute.rb"
          cp .github/scripts/typing_stats_compare.rb "$RUNNER_TEMP/typing_stats_compare.rb"

      - name: Run typing stats on current branch
        id: typing-stats-current
        env:
          STEEPFILE_PATH: ${{ github.workspace }}/Steepfile
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tmp"
          ruby "$RUNNER_TEMP/typing_stats_compute.rb" > "$RUNNER_TEMP/typing-stats-current.json"

      - name: Checkout base commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.base.sha }}

      - name: Run typing stats on base commit
        id: typing-stats-base
        env:
          STEEPFILE_PATH: ${{ github.workspace }}/Steepfile
        run: ruby "$RUNNER_TEMP/typing_stats_compute.rb" > "$RUNNER_TEMP/typing-stats-base.json"

      - name: Run typing stats compare
        id: typing-stats-compare
        env:
          CURRENT_STATS_PATH: ${{ runner.temp }}/typing-stats-current.json
          BASE_STATS_PATH: ${{ runner.temp }}/typing-stats-base.json
        run: |
          ruby "$RUNNER_TEMP/typing_stats_compare.rb" > "$RUNNER_TEMP/typing-stats-compare.md"
          if [ -s "$RUNNER_TEMP/typing-stats-compare.md" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            cat "$RUNNER_TEMP/typing-stats-compare.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No typing changes compared with the base branch." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload typing comparison
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: typing-stats-${{ github.run_attempt }}-${{ steps.typing-stats-compare.outputs.changed == 'true' && 'changed' || 'unchanged' }}
          path: ${{ runner.temp }}/typing-stats-compare.md
          if-no-files-found: error
