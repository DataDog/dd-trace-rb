name: Check change log entry

on: # yamllint disable-line rule:truthy
  pull_request:
    types: [opened, reopened, synchronize]

permissions: {}

jobs:
  lint:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      BUNDLE_GEMFILE: gemfiles/ruby-4.0.gemfile
      BUNDLE_FROZEN: "true"
      BASE_REF: ${{ github.base_ref }}
      VALE_VERSION: "3.12.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check for changed changelog fragments
        id: changed
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_REF"
          {
            echo "files<<EOF"
            git diff --name-only "origin/$BASE_REF"...HEAD -- 'unreleased/*.json'
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Ruby
        if: steps.changed.outputs.files != ''
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: "4.0.1"
          bundler-cache: true

      - name: Validate changelog fragment schema
        if: steps.changed.outputs.files != ''
        run: bundle exec rake changelog:lint

      - name: Install vale
        if: steps.changed.outputs.files != ''
        env:
          VALE_SHA256: 3f4ea05cd1f2291b660ecf11a77cbb6b544b0f3b780604ad183f63285611321b
        run: |
          curl -sSL -o /tmp/vale.tar.gz \
            "https://github.com/vale-cli/vale/releases/download/v${VALE_VERSION}/vale_${VALE_VERSION}_Linux_64-bit.tar.gz"
          echo "$VALE_SHA256  /tmp/vale.tar.gz" | sha256sum -c -
          tar -xzf /tmp/vale.tar.gz -C /tmp vale
          install /tmp/vale /usr/local/bin/vale
          vale --version

      - name: Lint changelog fragment messages
        if: steps.changed.outputs.files != ''
        run: bundle exec rake changelog:lint_messages
