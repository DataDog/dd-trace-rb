name: Check Pull Request CI Status

on: # yamllint disable-line rule:truthy
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  all-jobs-are-green:
    runs-on: ubuntu-24.04
    timeout-minutes: 95
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read
      statuses: read
    steps:
      - name: Run Ensure CI Success
        uses: DataDog/ensure-ci-success@b0d931ac77c810490e61964c321103040eef888e # v2.3.0
        with:
          # How long to wait before we start checking the job status
          # GitHub's API has a limit, so this helps avoid making too many calls
          # Note: If the job is retried, we'll check it once right away before waiting
          # Why 3 minutes: If a job fails, the all-green job also fails. If the original
          # job is retried and the all-green job is retried, the all-green job will not
          # see that all jobs are successful on the first invocation (since the failed
          # job is still running). But because we are not running the full test suite,
          # we do not want to wait 15 minutes to check if everything passed.
          initial-delay-seconds: 180

          # How long to wait between each check
          # Total wait time: 180s + (87 retries × 60s) = 5400s = 1.5 hours
          max-retries: 87

          # Sleep time between each check (default: 60 seconds)
          # polling-interval-seconds: "60"

          # Excluded check names/status contexts; each pattern is a regular expression that must fully match.
          # Reporting and metadata automation do not validate the proposed code.
          ignored-name-patterns: |
            devflow/.*
            DDCI Status
            dd/junit
            dd/coverage
            green-ci/exclude-metrics
            compute-stats
            typing-stats/comment
            triage
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1.329.0
        with:
          ruby-version: "4.0.1"
          bundler: none
      - name: Verify required checks ran successfully
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: ruby .github/scripts/ci/required_checks.rb "$GITHUB_REPOSITORY" "$HEAD_SHA" "$PR_NUMBER"
