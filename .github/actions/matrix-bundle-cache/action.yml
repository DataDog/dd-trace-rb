name: Prepare matrix bundle cache

description: Find or build a matrix bundle containing dependencies for every selected Gemfile

inputs:
  base-gemfile:
    description: Runtime base Gemfile
    required: true
  image:
    description: Engine image reference
    required: true
  tasks:
    description: Complete selected task list as JSON
    required: true
  gemfiles:
    description: Unique selected Gemfiles as JSON
    required: true
  write-enabled:
    description: Whether a miss may build and save current bundle
    required: true

outputs:
  matrix-cache-key:
    description: Exact matrix bundle cache key
    value: ${{ steps.matrix-key.outputs.cache-key }}
  base-cache-key:
    description: Exact base bundle cache key
    value: ${{ steps.base-key.outputs.cache-key }}
  base-lockfile:
    description: Base lockfile artifact name when fallback is prepared
    value: ${{ steps.base-bundle.outputs.lockfile }}
  ready:
    description: Whether the matrix bundle is available to child jobs
    value: ${{ steps.lookup.outputs.cache-hit == 'true' || inputs.write-enabled == 'true' }}

runs:
  using: composite
  steps:
    - id: base-key
      name: Compute base bundle key
      shell: bash
      env:
        BASE_GEMFILE: ${{ inputs.base-gemfile }}
        IMAGE: ${{ inputs.image }}
      run: |
        cache_key=$(ruby tasks/matrix_bundle_cache.rb base-key \
          --base-gemfile "$BASE_GEMFILE" \
          --image-identity "$IMAGE")
        echo "cache-key=$cache_key" >> "$GITHUB_OUTPUT"
    - id: matrix-key
      name: Compute matrix bundle key
      shell: bash
      env:
        BASE_CACHE_KEY: ${{ steps.base-key.outputs.cache-key }}
        BASE_GEMFILE: ${{ inputs.base-gemfile }}
        GEMFILES: ${{ inputs.gemfiles }}
      run: |
        cache_key=$(ruby tasks/matrix_bundle_cache.rb matrix-key \
          --base-gemfile "$BASE_GEMFILE" \
          --base-cache-key "$BASE_CACHE_KEY" \
          --gemfiles "$GEMFILES")
        echo "cache-key=$cache_key" >> "$GITHUB_OUTPUT"
    - id: lookup
      name: Find matrix bundle
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        key: ${{ steps.matrix-key.outputs.cache-key }}
        path: /usr/local/bundle
        lookup-only: true
    - id: base-bundle
      name: Prepare base bundle
      if: steps.lookup.outputs.cache-hit != 'true'
      uses: ./.github/actions/bundle-cache
      env:
        BUNDLE_GEMFILE: ${{ inputs.base-gemfile }}
      with:
        cache-key: ${{ steps.base-key.outputs.cache-key }}
    - name: Clean restored base bundle
      if: steps.lookup.outputs.cache-hit != 'true' && inputs.write-enabled == 'true'
      shell: bash
      env:
        BUNDLE_GEMFILE: ${{ inputs.base-gemfile }}
      run: bundle clean --force
    - name: Install matrix bundles
      if: steps.lookup.outputs.cache-hit != 'true' && inputs.write-enabled == 'true'
      shell: bash
      env:
        BUNDLE_GEMFILE: ${{ inputs.base-gemfile }}
        BATCHED_TASKS: ${{ inputs.tasks }}
      run: bundle exec rake github:run_batch_build
    - name: Verify complete matrix bundle
      if: steps.lookup.outputs.cache-hit != 'true' && inputs.write-enabled == 'true'
      shell: bash
      env:
        BUNDLE_GEMFILE: ${{ inputs.base-gemfile }}
        GEMFILES: ${{ inputs.gemfiles }}
      run: bundle exec rake github:check_matrix_bundle
    - name: Save matrix bundle
      if: steps.lookup.outputs.cache-hit != 'true' && inputs.write-enabled == 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        key: ${{ steps.matrix-key.outputs.cache-key }}
        path: /usr/local/bundle
