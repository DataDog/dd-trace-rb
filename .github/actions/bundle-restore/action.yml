name: 'Restore bundle cache'

description: 'Restores bundle cache for GitHub Actions'

inputs:
  key:
    description: 'Cache key for bundle'
    required: true
  restore-keys:
    description: 'Ordered fallback key prefixes'
    required: false
    default: ''
  lookup-only:
    description: 'Check availability without downloading the bundle'
    required: false
    default: 'false'

outputs:
  cache-key:
    description: 'Matched cache key, or empty on a miss'
    value: ${{ steps.restore-cache.outputs.cache-matched-key }}
  cache-outcome:
    description: 'Cache lookup or restore outcome, exact, partial, or miss'
    value: >-
      ${{ steps.restore-cache.outputs.cache-hit == 'true' && 'exact'
          || (steps.restore-cache.outputs.cache-matched-key != '' && 'partial' || 'miss') }}

runs:
  using: composite
  steps:
  - name: Restore cache
    uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
    id: restore-cache
    with:
      key: "${{ inputs.key }}"
      path: "/usr/local/bundle"
      lookup-only: ${{ inputs.lookup-only == 'true' }}
      restore-keys: ${{ inputs.restore-keys }}
