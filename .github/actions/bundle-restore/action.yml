name: 'Restore bundle cache'

description: 'Restores bundle cache for GitHub Actions'

inputs:
  key:
    description: 'Cache key for bundle'
    required: true
  restore-keys:
    description: 'Ordered fallback key prefixes'
    required: false
    default: ''
  lookup-only:
    description: 'Check availability without downloading the bundle'
    required: false
    default: 'false'
  require-exact:
    description: 'Fail unless the requested cache key matches exactly'
    required: false
    default: 'false'

outputs:
  cache-hit:
    description: 'Whether the requested cache key matched exactly'
    value: ${{ steps.restore-cache.outputs.cache-hit }}
  cache-matched-key:
    description: 'Full key of the matching cache, including partial matches'
    value: ${{ steps.restore-cache.outputs.cache-matched-key }}

runs:
  using: composite
  steps:
  - name: Restore cache
    uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
    id: restore-cache
    with:
      key: "${{ inputs.key }}"
      path: "/usr/local/bundle"
      lookup-only: ${{ inputs.lookup-only == 'true' }}
      restore-keys: ${{ inputs.restore-keys }}
  - name: Require exact cache hit
    if: inputs.require-exact == 'true' && steps.restore-cache.outputs.cache-hit != 'true'
    shell: bash
    run: |
      echo "::error::Expected an exact bundle cache hit." >&2
      exit 1
