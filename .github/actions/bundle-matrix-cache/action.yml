name: Prepare matrix bundle

description: 'Sets up bundle cache for matrix tests'

inputs:
  image:
    description: Engine image reference
    required: true
  gemfiles:
    description: Selected matrix Gemfiles as JSON
    required: true

outputs:
  cache-key:
    description: Full key for the selected core or matrix cache
    value: >-
      ${{ github.ref == 'refs/heads/master' && steps.key.outputs.cache-key
          || steps.lookup.outputs.cache-matched-key || steps.core.outputs.cache-key }}
  coverage:
    description: Dependency coverage of the selected cache, core, partial, or matrix
    value: >-
      ${{ (steps.lookup.outputs.cache-hit == 'true' || github.ref == 'refs/heads/master')
          && 'matrix' || (steps.lookup.outputs.cache-matched-key != '' && 'partial' || 'core') }}

runs:
  using: composite
  steps:
    - name: Compute matrix cache key
      id: key
      shell: bash
      env:
        IMAGE: ${{ inputs.image }}
        GEMFILES: ${{ inputs.gemfiles }}
      run: |
        cache_key=$(ruby tasks/bundle_cache.rb matrix-key)
        logic_prefix="${cache_key%-*}-"
        image_prefix="${cache_key%-*-*}-"
        {
          echo "cache-key=$cache_key"
          echo 'restore-keys<<EOF'
          echo "$logic_prefix"
          echo "$image_prefix"
          echo 'EOF'
        } >> "$GITHUB_OUTPUT"
    - name: Find matrix cache
      id: lookup
      uses: ./.github/actions/bundle-restore
      with:
        cache-key: ${{ steps.key.outputs.cache-key }}
        lookup-only: true
        restore-keys: ${{ github.ref != 'refs/heads/master' && steps.key.outputs.restore-keys || '' }}
    - name: Prepare core fallback
      id: core
      if: steps.lookup.outputs.cache-matched-key == ''
      uses: ./.github/actions/bundle-cache
      with:
        image: ${{ inputs.image }}
    - name: Clean restored core bundle
      if: github.ref == 'refs/heads/master' && steps.lookup.outputs.cache-hit != 'true'
      shell: bash
      run: bundle clean --force
    - name: Prepare matrix dependencies
      if: github.ref == 'refs/heads/master' && steps.lookup.outputs.cache-hit != 'true'
      shell: bash
      env:
        GEMFILES: ${{ inputs.gemfiles }}
      run: bundle exec rake github:prepare_matrix_bundle
    - name: Save matrix cache
      if: github.ref == 'refs/heads/master' && steps.lookup.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        key: ${{ steps.key.outputs.cache-key }}
        path: /usr/local/bundle
