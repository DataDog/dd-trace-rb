name: Restore installed matrix bundle

description: Restore an installed matrix bundle built by the batch job

inputs:
  cache-key:
    description: Exact installed bundle cache key
    required: true
  restore-prefix:
    description: Environment-specific partial restore prefix
    required: false
    default: ''
  strategy:
    description: Installed bundle architecture
    required: false
    default: full
  group:
    description: Batch group restored by grouped architectures
    required: false
    default: ''

outputs:
  exact-hit:
    description: Whether exact installed bundle cache was restored
    value: ${{ steps.restore.outputs.cache-hit }}
  matched-key:
    description: Exact or partial cache key restored
    value: ${{ steps.restore.outputs.cache-matched-key }}
  restore-seconds:
    description: Cache restore duration
    value: ${{ steps.duration.outputs.seconds }}

runs:
  using: composite
  steps:
    - id: start
      shell: bash
      run: echo "seconds=$(date +%s)" >> "$GITHUB_OUTPUT"
    - id: restore
      name: Restore installed bundle
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        key: ${{ inputs.cache-key }}
        restore-keys: ${{ (inputs.strategy == 'all-delta' || startsWith(inputs.strategy, 'group-')) && inputs.restore-prefix || '' }}
        path: ${{ inputs.strategy == 'all-delta' && '/tmp/ddtrace-installed-bundle-delta' || (startsWith(inputs.strategy, 'group-') && format('/tmp/ddtrace-installed-bundle-groups/{0}', inputs.group) || '/usr/local/bundle') }}
        fail-on-cache-miss: true
    - name: Apply installed bundle delta
      if: inputs.strategy == 'all-delta' || inputs.strategy == 'group-delta'
      shell: bash
      env:
        DELTA_PATH: ${{ inputs.strategy == 'all-delta' && '/tmp/ddtrace-installed-bundle-delta' || format('/tmp/ddtrace-installed-bundle-groups/{0}', inputs.group) }}
      run: cp -a "$DELTA_PATH"/. /usr/local/bundle/
    - name: Apply full installed bundle group
      if: inputs.strategy == 'group-full'
      shell: bash
      env:
        GROUP_PATH: ${{ format('/tmp/ddtrace-installed-bundle-groups/{0}', inputs.group) }}
      run: |
        find /usr/local/bundle -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +
        cp -a "$GROUP_PATH"/. /usr/local/bundle/
    - id: duration
      shell: bash
      env:
        START_SECONDS: ${{ steps.start.outputs.seconds }}
      run: echo "seconds=$(($(date +%s) - START_SECONDS))" >> "$GITHUB_OUTPUT"
