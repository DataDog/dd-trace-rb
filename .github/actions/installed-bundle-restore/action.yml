name: Restore partitioned installed bundle

description: Restore installed base and one exact batch-group partition

inputs:
  base-cache-key:
    description: Exact installed base bundle cache key
    required: true
  base-gemfile:
    description: Runtime base Gemfile
    required: true
  cache-key:
    description: Exact installed bundle group cache key
    required: true
  group:
    description: Batch group to restore
    required: true

outputs:
  exact-hit:
    description: Whether exact installed bundle group was restored
    value: ${{ steps.restore.outputs.cache-hit }}
  matched-key:
    description: Exact installed bundle group key restored
    value: ${{ steps.restore.outputs.cache-matched-key }}
  restore-seconds:
    description: Base restore, path computation, and group restore duration
    value: ${{ steps.duration.outputs.seconds }}

runs:
  using: composite
  steps:
    - id: start
      shell: bash
      run: echo "seconds=$(date +%s)" >> "$GITHUB_OUTPUT"
    - id: restore-base
      name: Restore installed base bundle
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        key: ${{ inputs.base-cache-key }}
        path: /usr/local/bundle
    - name: Install missing base bundle
      if: steps.restore-base.outputs.cache-hit != 'true'
      shell: bash
      env:
        BUNDLE_GEMFILE: ${{ inputs.base-gemfile }}
      run: bundle install
    - id: group-paths
      shell: bash
      env:
        GROUP: ${{ inputs.group }}
      run: |
        ruby -rjson -e '
          group = {"name" => ENV.fetch("GROUP"), "tasks" => JSON.parse(ENV.fetch("BATCHED_TASKS"))}
          File.write("/tmp/ddtrace-installed-bundle-child-group.json", JSON.generate("groups" => {ENV.fetch("GROUP") => group}))
        '
        ruby tasks/installed_bundle_cache_cli.rb cache-paths --base-gemfile "$BUNDLE_GEMFILE" --groups /tmp/ddtrace-installed-bundle-child-group.json --group "$GROUP" > /tmp/ddtrace-installed-bundle-child-paths
        delimiter="CACHE_PATHS_${RANDOM}_${RANDOM}"
        {
          echo "value<<$delimiter"
          cat /tmp/ddtrace-installed-bundle-child-paths
          echo "$delimiter"
        } >> "$GITHUB_OUTPUT"
    - id: restore
      name: Restore installed bundle group
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        key: ${{ inputs.cache-key }}
        path: ${{ steps.group-paths.outputs.value }}
    - id: duration
      shell: bash
      env:
        START_SECONDS: ${{ steps.start.outputs.seconds }}
      run: echo "seconds=$(($(date +%s) - START_SECONDS))" >> "$GITHUB_OUTPUT"
