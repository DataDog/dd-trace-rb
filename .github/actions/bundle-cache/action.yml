name: 'Prepare bundle cache'

description: >-
  Caching strategy: two cache entries total:
    * `matrix` cache: *all* gems, including the whole Matrixfile. This is used to run tests.
    * `core` cache: only gems related to Ruby versions themselves. This is used for everything else.

  `matrix` includes `core` gems: it's safer to duplicate this data, than try to remove the intersection safely.

  The cache key is:
       bundle-<core|matrix>-v<version>-<image+bundler config>-<cache logic>-<gemfiles>

  Which allows for partial cache reuse, from higher to lower reuse:
    1. Gemfiles changes.
    2. Cache logic changes.

  If the docker image or bundler configuration changes, it's a cache miss.

  On miss, or partial matching, bundle install is run after cache restoration.

  New cache entries are only uploaded on master runs. This accomplishes a few things:
    1. Given our concurrent test suite, we cannot have multiple runners publishing to the
    same cache key (GitHub doesn't like it). If we instead created a separate cache key per
    concurrent run, we'd quickly exhaust our 10GiB repo cache limit, given each unique
    cache key combination (if we combine both core and matrix) is around 400MiB.
    2. dd-trace-rb's cache is only valuable for reuse if it matches the criteria
    `<image+bundler config>-<cache logic>-<gemfiles>`. Otherwise, we'd be publishing
    caches that are too specific to our branches, and exhusting the 10GiB limit
    for almost not cache reuse.
      a. Publishing in every branch or PR is unnecessary, if change criteria is not met,
      even if cache entries were smaller.

  Break glass mechanism: If external forces messed up the saved cache, change the value
  of the CI environment variable `CACHE_VERSION` to invalidate all caches; then rerun
  master for a fresh start.

inputs:
  image:
    description: Engine image reference
    required: true

outputs:
  cache-key:
    description: 'Cache key for the bundle'
    value: >-
      ${{ github.ref == 'refs/heads/master' && steps.key.outputs.cache-key
          || steps.restore-cache.outputs.cache-key || steps.key.outputs.cache-key }}

runs:
  using: "composite"
  steps:
    - name: Compute core cache key
      id: key
      shell: bash
      env:
        IMAGE: ${{ inputs.image }}
      run: ruby .github/scripts/bundle_cache.rb core >> "$GITHUB_OUTPUT"
    - name: Restore cache
      id: restore-cache
      uses: ./.github/actions/bundle-restore
      with:
        key: ${{ steps.key.outputs.cache-key }}
        restore-keys: ${{ github.ref != 'refs/heads/master' && steps.key.outputs.restore-keys || '' }}
    - name: Install core dependencies
      if: steps.restore-cache.outputs.cache-outcome != 'exact'
      shell: bash
      run: bundle check || bundle install
    - name: Save cache
      if: github.ref == 'refs/heads/master' && steps.restore-cache.outputs.cache-outcome != 'exact'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        key: "${{ steps.key.outputs.cache-key }}"
        path: "/usr/local/bundle"
