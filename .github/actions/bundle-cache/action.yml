name: Prepare base bundle

description: Restore or install the base bundle and save its cache only on master

inputs:
  image:
    description: Engine image reference
    required: true

outputs:
  cache-key:
    description: Exact base bundle cache key
    value: ${{ steps.key.outputs.cache-key }}

runs:
  using: composite
  steps:
    - name: Compute base cache key
      id: key
      shell: bash
      env:
        IMAGE: ${{ inputs.image }}
      run: |
        cache_key=$(ruby tasks/bundle_cache.rb base-key)
        echo "cache-key=$cache_key" >> "$GITHUB_OUTPUT"
    - name: Restore base cache
      id: restore
      uses: ./.github/actions/bundle-restore
      with:
        cache-key: ${{ steps.key.outputs.cache-key }}
    - name: Install base dependencies
      if: steps.restore.outputs.cache-hit != 'true'
      shell: bash
      run: bundle install
    - name: Save base cache
      if: github.ref == 'refs/heads/master' && steps.restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        key: ${{ steps.key.outputs.cache-key }}
        path: /usr/local/bundle
