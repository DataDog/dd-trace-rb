name: 'Prepare bundle cache'

description: >-
  Sets up bundle cache for GitHub Actions.
  Saves caches only on refs/heads/master; other branches may restore caches and install gems locally.

inputs:
  image:
    description: Engine image reference
    required: true

outputs:
  cache-key:
    description: 'Cache key for the bundle'
    value: >-
      ${{ github.ref == 'refs/heads/master' && steps.key.outputs.cache-key
          || steps.restore-cache.outputs.cache-key || steps.key.outputs.cache-key }}

runs:
  using: "composite"
  steps:
    - name: Compute core cache key
      id: key
      shell: bash
      env:
        IMAGE: ${{ inputs.image }}
      run: ruby .github/scripts/bundle_cache.rb core >> "$GITHUB_OUTPUT"
    - name: Restore cache
      id: restore-cache
      uses: ./.github/actions/bundle-restore
      with:
        key: ${{ steps.key.outputs.cache-key }}
        restore-keys: ${{ github.ref != 'refs/heads/master' && steps.key.outputs.restore-keys || '' }}
    - name: Install core dependencies
      if: steps.restore-cache.outputs.cache-outcome != 'exact'
      shell: bash
      run: bundle check || bundle install
    - name: Save cache
      if: github.ref == 'refs/heads/master' && steps.restore-cache.outputs.cache-outcome != 'exact'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        key: "${{ steps.key.outputs.cache-key }}"
        path: "/usr/local/bundle"
