name: 'Prepare bundle cache'

description: >-
  Sets up bundle cache for GitHub Actions in /usr/local/bundle.
  Core caches cover BUNDLE_GEMFILE; matrix caches also cover selected test Gemfiles.
  Keys include CACHE_VERSION and separate hashes for image/Bundler settings, cache logic,
  and Gemfile/lockfile contents.
  Master uses exact keys and is the only branch that saves prepared caches.
  Other branches try the exact key, then the image/settings-plus-logic prefix,
  then the image/settings prefix, and never save caches.
  Matched historical keys are forwarded to matrix test workers.
  Prefix matches provide warm dependencies, not proof that current Gemfiles are satisfied.
  Workers skip dependency preparation only after an exact restore of the current matrix cache.
  Otherwise they check/install core and assigned matrix dependencies, even when a historical key restores exactly.
  Lockfiles stay frozen. Bump CACHE_VERSION when cache layouts become incompatible.

inputs:
  image:
    description: Engine image reference
    required: true

outputs:
  cache-key:
    description: 'Cache key for the bundle'
    value: >-
      ${{ github.ref == 'refs/heads/master' && steps.key.outputs.cache-key
          || steps.restore-cache.outputs.cache-key || steps.key.outputs.cache-key }}

runs:
  using: "composite"
  steps:
    - name: Compute core cache key
      id: key
      shell: bash
      env:
        IMAGE: ${{ inputs.image }}
      run: ruby .github/scripts/bundle_cache.rb core >> "$GITHUB_OUTPUT"
    - name: Restore cache
      id: restore-cache
      uses: ./.github/actions/bundle-restore
      with:
        key: ${{ steps.key.outputs.cache-key }}
        restore-keys: ${{ github.ref != 'refs/heads/master' && steps.key.outputs.restore-keys || '' }}
    - name: Install core dependencies
      if: steps.restore-cache.outputs.cache-outcome != 'exact'
      shell: bash
      run: bundle check || bundle install
    - name: Save cache
      if: github.ref == 'refs/heads/master' && steps.restore-cache.outputs.cache-outcome != 'exact'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        key: "${{ steps.key.outputs.cache-key }}"
        path: "/usr/local/bundle"
