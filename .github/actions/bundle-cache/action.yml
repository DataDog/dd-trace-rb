name: 'Prepare bundle cache'

description: >-
  Reuse installed gems so CI jobs do not rebuild the same dependencies independently.
  Core caches cover the runtime Gemfile; matrix caches also cover scheduled test Gemfiles,
  allowing workers for the same runtime to share one prepared bundle.

  Only master publishes caches to avoid branch-specific copies crowding out shared caches.
  Branch jobs prefer caches for their current dependencies and cache logic,
  then use older compatible caches to reduce installation work.

  Cache keys isolate images and Bundler settings but allow reuse across dependency and cache-logic changes.
  Current lockfiles, not cache contents, determine required dependencies;
  jobs check and repair older caches before tests.
  Bump CACHE_VERSION when cache-layout changes make older caches incompatible.

inputs:
  image:
    description: Engine image reference
    required: true

outputs:
  cache-key:
    description: 'Cache key for the bundle'
    value: >-
      ${{ github.ref == 'refs/heads/master' && steps.key.outputs.cache-key
          || steps.restore-cache.outputs.cache-key || steps.key.outputs.cache-key }}

runs:
  using: "composite"
  steps:
    - name: Compute core cache key
      id: key
      shell: bash
      env:
        IMAGE: ${{ inputs.image }}
      run: ruby .github/scripts/bundle_cache.rb core >> "$GITHUB_OUTPUT"
    - name: Restore cache
      id: restore-cache
      uses: ./.github/actions/bundle-restore
      with:
        key: ${{ steps.key.outputs.cache-key }}
        restore-keys: ${{ github.ref != 'refs/heads/master' && steps.key.outputs.restore-keys || '' }}
    - name: Install core dependencies
      if: steps.restore-cache.outputs.cache-outcome != 'exact'
      shell: bash
      run: bundle check || bundle install
    - name: Save cache
      if: github.ref == 'refs/heads/master' && steps.restore-cache.outputs.cache-outcome != 'exact'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        key: "${{ steps.key.outputs.cache-key }}"
        path: "/usr/local/bundle"
