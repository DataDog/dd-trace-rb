name: 'Prepare base bundle cache'

description: 'Sets up a base bundle cache for GitHub Actions'

inputs:
  image:
    description: 'Engine image reference'
    required: true
  cache-key:
    description: 'Precomputed exact cache key'
    required: false
    default: ''

outputs:
  cache-key:
    description: 'Cache key for the base bundle'
    value: ${{ steps.base-key.outputs.cache-key }}

runs:
  using: "composite"
  steps:
    - name: Compute base bundle key
      id: base-key
      shell: bash
      env:
        CACHE_KEY: ${{ inputs.cache-key }}
        IMAGE: ${{ inputs.image }}
      run: |
        cache_key="$CACHE_KEY"
        if [ -z "$cache_key" ]; then
          cache_key=$(ruby tasks/matrix_bundle_cache.rb base-key \
            --base-gemfile "${BUNDLE_GEMFILE:-Gemfile}" \
            --image "$IMAGE")
        fi
        echo "cache-key=$cache_key" >> "$GITHUB_OUTPUT"
    - name: Restore cache
      uses: ./.github/actions/bundle-restore
      id: restore-cache
      with:
        cache-key: ${{ steps.base-key.outputs.cache-key }}
    - if: steps.restore-cache.outputs.cache-hit != 'true'
      shell: bash
      run: bundle install
    - if: github.ref == 'refs/heads/master' && steps.restore-cache.outputs.cache-hit != 'true'
      name: Save cache
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        key: ${{ steps.base-key.outputs.cache-key }}
        path: "/usr/local/bundle"
