name: 'Build and Test'

# TODO: Improve  description
description: 'Configure test suite in batches'

inputs:
  alias:
    description: 'Runtime alias'
    required: true
  container-id:
    description: 'Container Identifier'
    required: true
  test-seed:
    description: 'Fixed test seed for comparable experimental runs'
    required: false
    default: ''
  install-dependencies:
    description: 'Run dependency checks and install missing gems for each batch'
    required: false
    default: 'true'
  minimal-tests:
    description: 'Run one RSpec example per spec file'
    required: false
    default: 'false'

runs:
  using: "composite"
  steps:
  - name: Configure Git
    run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
    shell: bash

  - id: bundle-install-start
    if: inputs.install-dependencies == 'true'
    run: echo "seconds=$(date +%s)" >> "$GITHUB_OUTPUT"
    shell: bash

  - name: Install batch dependencies
    if: inputs.install-dependencies == 'true'
    run: bundle exec rake github:run_batch_build
    shell: bash

  - name: Report batch dependency installation
    if: inputs.install-dependencies == 'true'
    shell: bash
    env:
      START_SECONDS: ${{ steps.bundle-install-start.outputs.seconds }}
    run: |
      duration=$(($(date +%s) - START_SECONDS))
      {
        echo "### Batch dependency installation"
        echo "- Duration: \`${duration}s\`"
      } >> "$GITHUB_STEP_SUMMARY"

  - name: Configure RSpec
    run: ln -s .rspec-local.example .rspec-local
    shell: bash

  - run: bundle exec rake github:run_batch_tests
    shell: bash
    env:
      COVERAGE_DIR: coverage/versions/${{ inputs.alias }}/${{ inputs.container-id }}
      CI_MINIMAL_TESTS: "${{ inputs.minimal-tests }}"
      CI_TEST_SEED: "${{ inputs.test-seed || github.run_id }}"
      SKIP_SIMPLECOV: "${{ inputs.minimal-tests == 'true' && '1' || '0' }}"

  - name: Display debug info
    if: ${{ !cancelled() }}
    shell: bash
    run: |
      df -h

  - name: Debug with SSH connection
    if: ${{ failure() && runner.debug == '1' }}
    uses: mxschmitt/action-tmate@35b54afac29c97fb54faba5b513f8fbd1882f113 # v3.24
    with:
      limit-access-to-actor: true
      # This mode will wait at the end of the job for a user to connect and then to terminate the tmate session.
      # If no user has connected within 10 minutes after the post-job step started,
      # it will terminate the tmate session and quit gracefully.
      detached: true

  - name: Validate test agent data
    if: ${{ !cancelled() }}
    run: ruby .github/scripts/test_agent_check.rb
    shell: bash

  - name: Upload junit reports
    if: ${{ !cancelled() }}
    uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
    with:
      name: junit-${{ inputs.alias }}-${{ inputs.container-id }}
      path: tmp/rspec/*.xml

  - name: Upload coverage data
    uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
    with:
      name: coverage-${{ inputs.alias }}-${{ inputs.container-id }}
      path: coverage
      include-hidden-files: true  # Coverage data generated by SimpleCov are hidden
