name: 'Build and Test'

# TODO: Improve  description
description: 'Configure test suite in batches'

inputs:
  alias:
    description: 'Runtime alias'
    required: true
  container-id:
    description: 'Container Identifier'
    required: true

runs:
  using: "composite"
  steps:
  - name: Configure Git
    run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
    shell: bash

  - name: Configure RSpec
    run: ln -s .rspec-local.example .rspec-local
    shell: bash

  - run: bundle exec rake github:run_batch
    shell: bash
    env:
      COVERAGE_DIR: coverage/versions/${{ inputs.alias }}/${{ inputs.container-id }}
      CI_TEST_SEED: "${{ github.run_id }}"

  - name: Display debug info
    if: ${{ !cancelled() }}
    shell: bash
    run: |
      df -h

  - name: Debug with SSH connection
    if: ${{ failure() && runner.debug == '1' }}
    uses: mxschmitt/action-tmate@35b54afac29c97fb54faba5b513f8fbd1882f113 # v3.24
    with:
      limit-access-to-actor: true
      # This mode waits at the end of the job for a user to connect, then
      # terminates the tmate session. It terminates the session after 10
      # minutes when no user connects.
      detached: true

  - name: Validate test agent data
    if: ${{ !cancelled() }}
    run: ruby .github/scripts/test_agent_check.rb
    shell: bash

  - name: Upload junit reports
    if: ${{ !cancelled() }}
    uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
    with:
      name: junit-${{ inputs.alias }}-${{ inputs.container-id }}
      path: tmp/rspec/*.xml

  - name: Upload task timings
    if: ${{ !cancelled() }}
    uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
    with:
      name: timings-${{ inputs.alias }}-${{ inputs.container-id }}
      path: tmp/ci-task-timings/*.json

  - name: Upload coverage data
    uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
    with:
      name: coverage-${{ inputs.alias }}-${{ inputs.container-id }}
      path: coverage
      include-hidden-files: true  # Coverage data generated by SimpleCov are hidden
