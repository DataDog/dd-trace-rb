name: Prepare installed matrix bundle cache

description: Find or build one installed bundle containing every applicable Gemfile

inputs:
  base-gemfile:
    description: Runtime base Gemfile
    required: true
  image:
    description: Engine image reference
    required: true
  write-enabled:
    description: Whether a miss may build and save current bundle
    required: true

outputs:
  cache-key:
    description: Exact installed bundle cache key
    value: ${{ steps.installed-key.outputs.cache-key }}
  base-cache-key:
    description: Exact lean base bundle cache key
    value: ${{ steps.base-key.outputs.cache-key }}
  base-lockfile:
    description: Base lockfile artifact name when fallback is prepared
    value: ${{ steps.base-bundle.outputs.lockfile }}
  ready:
    description: Whether complete bundle is available to child jobs
    value: ${{ steps.lookup.outputs.cache-hit == 'true' || inputs.write-enabled == 'true' }}

runs:
  using: composite
  steps:
    - id: base-key
      name: Compute base bundle key
      shell: bash
      env:
        BASE_GEMFILE: ${{ inputs.base-gemfile }}
        IMAGE: ${{ inputs.image }}
      run: |
        cache_key=$(ruby tasks/installed_bundle_cache.rb base-key \
          --base-gemfile "$BASE_GEMFILE" \
          --image-identity "${IMAGE##*/}")
        echo "cache-key=$cache_key" >> "$GITHUB_OUTPUT"
    - id: installed-key
      name: Compute installed bundle key
      shell: bash
      env:
        BASE_CACHE_KEY: ${{ steps.base-key.outputs.cache-key }}
        BASE_GEMFILE: ${{ inputs.base-gemfile }}
      run: |
        cache_key=$(ruby tasks/installed_bundle_cache.rb key \
          --base-gemfile "$BASE_GEMFILE" \
          --base-cache-key "$BASE_CACHE_KEY")
        echo "cache-key=$cache_key" >> "$GITHUB_OUTPUT"
    - id: lookup
      name: Find installed bundle
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        key: ${{ steps.installed-key.outputs.cache-key }}
        path: /usr/local/bundle
        lookup-only: true
    - id: base-bundle
      name: Prepare lean base bundle
      if: steps.lookup.outputs.cache-hit != 'true'
      uses: ./.github/actions/bundle-cache
      env:
        BUNDLE_GEMFILE: ${{ inputs.base-gemfile }}
      with:
        cache-key: ${{ steps.base-key.outputs.cache-key }}
    - name: Install appraisal bundles
      if: steps.lookup.outputs.cache-hit != 'true' && inputs.write-enabled == 'true'
      shell: bash
      env:
        BASE_GEMFILE: ${{ inputs.base-gemfile }}
      run: ruby tasks/installed_bundle_cache.rb install-appraisals --base-gemfile "$BASE_GEMFILE"
    - name: Verify complete matrix bundle
      if: steps.lookup.outputs.cache-hit != 'true' && inputs.write-enabled == 'true'
      shell: bash
      env:
        BASE_GEMFILE: ${{ inputs.base-gemfile }}
      run: ruby tasks/installed_bundle_cache.rb check --base-gemfile "$BASE_GEMFILE"
    - name: Save installed bundle
      if: steps.lookup.outputs.cache-hit != 'true' && inputs.write-enabled == 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        key: ${{ steps.installed-key.outputs.cache-key }}
        path: /usr/local/bundle
