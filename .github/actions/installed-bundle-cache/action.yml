name: Prepare installed matrix bundle cache

description: Find or build one installed bundle containing every applicable Gemfile

inputs:
  base-gemfile:
    description: Runtime base Gemfile
    required: true
  image-identity:
    description: Immutable engine image identity
    required: true
  write-enabled:
    description: Whether a miss may build and save current bundle
    required: false
    default: "false"

outputs:
  cache-key:
    description: Exact installed bundle cache key
    value: ${{ steps.installed-key.outputs.cache-key }}
  base-cache-key:
    description: Exact lean base bundle cache key
    value: ${{ steps.base-key.outputs.cache-key }}
  base-lockfile:
    description: Base lockfile artifact name when fallback is prepared
    value: ${{ steps.base-bundle.outputs.lockfile }}
  ready:
    description: Whether complete bundle is available to child jobs
    value: ${{ steps.result.outputs.ready }}

runs:
  using: composite
  steps:
    - id: ruby-environment
      name: Compute base Ruby environment
      shell: bash
      run: |
        value=$(ruby -rrubygems -e 'puts [RUBY_DESCRIPTION, Gem.extension_api_version].join("-")')
        echo "value=$value" >> "$GITHUB_OUTPUT"
    - id: base-key
      name: Compute base bundle key
      shell: bash
      env:
        BASE_GEMFILE: ${{ inputs.base-gemfile }}
        LOCKFILE_HASH: ${{ hashFiles(format('{0}.lock', inputs.base-gemfile)) }}
        RUBY_ENVIRONMENT: ${{ steps.ruby-environment.outputs.value }}
      run: |
        lockfile="$BASE_GEMFILE.lock"
        if [ ! -f "$lockfile" ]; then
          echo "::error::Expected lockfile $lockfile not found." >&2
          exit 1
        fi
        if [ -z "$LOCKFILE_HASH" ]; then
          echo "::error::Could not hash lockfile $lockfile." >&2
          exit 1
        fi
        echo "cache-key=bundle-$RUBY_ENVIRONMENT-$LOCKFILE_HASH" >> "$GITHUB_OUTPUT"
    - id: installed-key
      name: Compute installed bundle key
      shell: bash
      env:
        BASE_CACHE_KEY: ${{ steps.base-key.outputs.cache-key }}
        BASE_GEMFILE: ${{ inputs.base-gemfile }}
        IMAGE_IDENTITY: ${{ inputs.image-identity }}
      run: |
        cache_key=$(ruby tasks/installed_bundle_cache.rb key \
          --base-gemfile "$BASE_GEMFILE" \
          --base-cache-key "$BASE_CACHE_KEY" \
          --image-identity "$IMAGE_IDENTITY")
        echo "cache-key=$cache_key" >> "$GITHUB_OUTPUT"
    - id: lookup
      name: Find installed bundle
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        key: ${{ steps.installed-key.outputs.cache-key }}
        path: /usr/local/bundle
        lookup-only: true
    - id: base-bundle
      name: Prepare lean base bundle
      if: steps.lookup.outputs.cache-hit != 'true'
      uses: ./.github/actions/bundle-cache
      env:
        BUNDLE_GEMFILE: ${{ inputs.base-gemfile }}
    - name: Verify base bundle identity
      if: steps.lookup.outputs.cache-hit != 'true'
      shell: bash
      env:
        ACTUAL_KEY: ${{ steps.base-bundle.outputs.cache-key }}
        EXPECTED_KEY: ${{ steps.base-key.outputs.cache-key }}
      run: |
        if [ "$ACTUAL_KEY" != "$EXPECTED_KEY" ]; then
          echo "::error::Base bundle key changed: expected $EXPECTED_KEY, got $ACTUAL_KEY." >&2
          exit 1
        fi
    - name: Install appraisal bundles
      if: steps.lookup.outputs.cache-hit != 'true' && inputs.write-enabled == 'true'
      shell: bash
      env:
        BASE_GEMFILE: ${{ inputs.base-gemfile }}
      run: ruby tasks/installed_bundle_cache.rb install-appraisals --base-gemfile "$BASE_GEMFILE"
    - name: Verify complete matrix bundle
      if: steps.lookup.outputs.cache-hit != 'true' && inputs.write-enabled == 'true'
      shell: bash
      env:
        BASE_GEMFILE: ${{ inputs.base-gemfile }}
      run: ruby tasks/installed_bundle_cache.rb check --base-gemfile "$BASE_GEMFILE"
    - name: Save installed bundle
      if: steps.lookup.outputs.cache-hit != 'true' && inputs.write-enabled == 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        key: ${{ steps.installed-key.outputs.cache-key }}
        path: /usr/local/bundle
    - id: result
      shell: bash
      env:
        EXACT_HIT: ${{ steps.lookup.outputs.cache-hit }}
        WRITE_ENABLED: ${{ inputs.write-enabled }}
      run: |
        if [ "$EXACT_HIT" = "true" ] || [ "$WRITE_ENABLED" = "true" ]; then
          ready=true
        else
          ready=false
        fi
        echo "ready=$ready" >> "$GITHUB_OUTPUT"
