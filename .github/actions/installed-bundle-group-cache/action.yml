name: Prepare partitioned installed bundle caches

description: Compute group caches and generate missing partitions on writable runs

inputs:
  base-gemfile:
    description: Runtime base Gemfile
    required: true
  standard-groups:
    description: Standard batch matrix JSON
    required: true
  misc-groups:
    description: Misc batch matrix JSON
    required: true
  cache-schema:
    description: Partitioned installed bundle cache schema
    required: true
  image-identity:
    description: Immutable engine image identity
    required: true
  write-enabled:
    description: Whether missing base and group caches may be generated
    required: false
    default: "false"

outputs:
  base-cache-key:
    description: Exact installed base bundle cache key
    value: ${{ steps.base-key.outputs.value }}
  cache-keys:
    description: Exact installed bundle cache keys by group
    value: ${{ steps.manifest.outputs.cache-keys }}
  status:
    description: "Writer status: deferred, exact, or generated"
    value: ${{ steps.result.outputs.status }}
  lookup-seconds:
    description: Writable parent lookup duration
    value: ${{ steps.lookup-duration.outputs.seconds }}
  population-seconds:
    description: Union population and partition validation duration
    value: ${{ steps.population-duration.outputs.seconds }}
  save-seconds:
    description: Group cache save duration
    value: ${{ steps.save-duration.outputs.seconds }}

runs:
  using: composite
  steps:
    - id: groups
      shell: bash
      env:
        MISC_GROUPS: ${{ inputs.misc-groups }}
        STANDARD_GROUPS: ${{ inputs.standard-groups }}
      run: |
        ruby -rjson -e '
          groups = {}
          {
            "standard" => JSON.parse(ENV.fetch("STANDARD_GROUPS")),
            "misc" => JSON.parse(ENV.fetch("MISC_GROUPS")),
          }.each do |kind, matrix|
            matrix.fetch("include").each do |entry|
              name = "#{kind}-#{entry.fetch("batch")}"
              groups[name] = {"name" => name, "tasks" => entry.fetch("tasks")}
            end
          end
          File.write("/tmp/ddtrace-installed-bundle-groups.json", JSON.generate("groups" => groups))
        '
    - id: ruby-environment
      shell: bash
      run: |
        value=$(ruby -rrubygems -e 'puts [RUBY_DESCRIPTION, Gem.extension_api_version].join("-")')
        echo "value=$value" >> "$GITHUB_OUTPUT"
    - id: base-key
      shell: bash
      env:
        LOCKFILE_HASH: ${{ hashFiles(format('{0}.lock', inputs.base-gemfile)) }}
        RUBY_ENVIRONMENT: ${{ steps.ruby-environment.outputs.value }}
      run: echo "value=bundle-$RUBY_ENVIRONMENT-$LOCKFILE_HASH" >> "$GITHUB_OUTPUT"
    - id: manifest
      name: Compute installed bundle group manifests
      shell: bash
      env:
        BASE_CACHE_KEY: ${{ steps.base-key.outputs.value }}
        BASE_GEMFILE: ${{ inputs.base-gemfile }}
        CACHE_SCHEMA: ${{ inputs.cache-schema }}
        IMAGE_IDENTITY: ${{ inputs.image-identity }}
      run: |
        ruby tasks/installed_bundle_cache_cli.rb group-manifests \
          --base-gemfile "$BASE_GEMFILE" \
          --groups /tmp/ddtrace-installed-bundle-groups.json \
          --cache-schema "$CACHE_SCHEMA" \
          --image-identity "$IMAGE_IDENTITY" \
          --base-cache-key "$BASE_CACHE_KEY" > /tmp/ddtrace-installed-bundle-group-manifests.json
        ruby -rjson -e '
          manifests = JSON.parse(File.read("/tmp/ddtrace-installed-bundle-group-manifests.json"))
          keys = manifests.transform_values { |manifest| manifest.fetch("cache_key") }
          File.open(ENV.fetch("GITHUB_OUTPUT"), "a") do |output|
            output.puts("cache-keys=#{JSON.generate(keys)}")
            manifests.each do |name, manifest|
              output.puts("#{name}-key=#{manifest.fetch("cache_key")}")
              delimiter = "CACHE_PATHS_#{name.upcase.tr("-", "_")}"
              output.puts("#{name}-paths<<#{delimiter}")
              output.puts(manifest.fetch("cache_paths").join("\n"))
              output.puts(delimiter)
            end
          end
        '
    - id: lookup-start
      if: inputs.write-enabled == 'true'
      shell: bash
      run: echo "seconds=$(date +%s)" >> "$GITHUB_OUTPUT"
    - id: lookup-base
      if: inputs.write-enabled == 'true'
      name: Look up installed base bundle
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        key: ${{ steps.base-key.outputs.value }}
        path: /usr/local/bundle
        lookup-only: true
    - id: lookup-standard-0
      if: inputs.write-enabled == 'true'
      name: Look up standard-0 installed bundle
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        key: ${{ steps.manifest.outputs.standard-0-key }}
        path: ${{ steps.manifest.outputs.standard-0-paths }}
        lookup-only: true
    - id: lookup-standard-1
      if: inputs.write-enabled == 'true'
      name: Look up standard-1 installed bundle
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        key: ${{ steps.manifest.outputs.standard-1-key }}
        path: ${{ steps.manifest.outputs.standard-1-paths }}
        lookup-only: true
    - id: lookup-standard-2
      if: inputs.write-enabled == 'true'
      name: Look up standard-2 installed bundle
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        key: ${{ steps.manifest.outputs.standard-2-key }}
        path: ${{ steps.manifest.outputs.standard-2-paths }}
        lookup-only: true
    - id: lookup-standard-3
      if: inputs.write-enabled == 'true'
      name: Look up standard-3 installed bundle
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        key: ${{ steps.manifest.outputs.standard-3-key }}
        path: ${{ steps.manifest.outputs.standard-3-paths }}
        lookup-only: true
    - id: lookup-standard-4
      if: inputs.write-enabled == 'true'
      name: Look up standard-4 installed bundle
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        key: ${{ steps.manifest.outputs.standard-4-key }}
        path: ${{ steps.manifest.outputs.standard-4-paths }}
        lookup-only: true
    - id: lookup-standard-5
      if: inputs.write-enabled == 'true'
      name: Look up standard-5 installed bundle
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        key: ${{ steps.manifest.outputs.standard-5-key }}
        path: ${{ steps.manifest.outputs.standard-5-paths }}
        lookup-only: true
    - id: lookup-standard-6
      if: inputs.write-enabled == 'true'
      name: Look up standard-6 installed bundle
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        key: ${{ steps.manifest.outputs.standard-6-key }}
        path: ${{ steps.manifest.outputs.standard-6-paths }}
        lookup-only: true
    - id: lookup-misc-0
      if: inputs.write-enabled == 'true'
      name: Look up misc-0 installed bundle
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        key: ${{ steps.manifest.outputs.misc-0-key }}
        path: ${{ steps.manifest.outputs.misc-0-paths }}
        lookup-only: true
    - id: lookup-duration
      if: inputs.write-enabled == 'true'
      shell: bash
      env:
        START_SECONDS: ${{ steps.lookup-start.outputs.seconds }}
      run: echo "seconds=$(($(date +%s) - START_SECONDS))" >> "$GITHUB_OUTPUT"
    - id: lifecycle
      if: inputs.write-enabled == 'true'
      shell: bash
      env:
        BASE_HIT: ${{ steps.lookup-base.outputs.cache-hit }}
        MISC_0_HIT: ${{ steps.lookup-misc-0.outputs.cache-hit }}
        STANDARD_0_HIT: ${{ steps.lookup-standard-0.outputs.cache-hit }}
        STANDARD_1_HIT: ${{ steps.lookup-standard-1.outputs.cache-hit }}
        STANDARD_2_HIT: ${{ steps.lookup-standard-2.outputs.cache-hit }}
        STANDARD_3_HIT: ${{ steps.lookup-standard-3.outputs.cache-hit }}
        STANDARD_4_HIT: ${{ steps.lookup-standard-4.outputs.cache-hit }}
        STANDARD_5_HIT: ${{ steps.lookup-standard-5.outputs.cache-hit }}
        STANDARD_6_HIT: ${{ steps.lookup-standard-6.outputs.cache-hit }}
      run: |
        generation_needed=false
        for name in STANDARD_0 STANDARD_1 STANDARD_2 STANDARD_3 STANDARD_4 STANDARD_5 STANDARD_6 MISC_0; do
          hit_name="${name}_HIT"
          [ "${!hit_name}" = "true" ] || generation_needed=true
        done
        { echo "base-missing=$([ "$BASE_HIT" = "true" ] && echo false || echo true)"; echo "generation-needed=$generation_needed"; } >> "$GITHUB_OUTPUT"
    - name: Restore installed base bundle for generation
      if: inputs.write-enabled == 'true' && steps.lifecycle.outputs.generation-needed == 'true' && steps.lifecycle.outputs.base-missing != 'true'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        key: ${{ steps.base-key.outputs.value }}
        path: /usr/local/bundle
        fail-on-cache-miss: true
    - name: Install missing base bundle
      if: steps.lifecycle.outputs.base-missing == 'true'
      shell: bash
      run: bundle install
    - name: Save installed base bundle
      if: steps.lifecycle.outputs.base-missing == 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        key: ${{ steps.base-key.outputs.value }}
        path: /usr/local/bundle
    - name: Preserve installed base bundle
      if: steps.lifecycle.outputs.generation-needed == 'true'
      shell: bash
      run: |
        rm -rf /tmp/ddtrace-installed-base-bundle
        mkdir -p /tmp/ddtrace-installed-base-bundle
        cp -a /usr/local/bundle/. /tmp/ddtrace-installed-base-bundle/
    - id: population-start
      if: steps.lifecycle.outputs.generation-needed == 'true'
      shell: bash
      run: echo "seconds=$(date +%s)" >> "$GITHUB_OUTPUT"
    - name: Prepare partitioned installed bundle groups
      if: steps.lifecycle.outputs.generation-needed == 'true'
      shell: bash
      env:
        BASE_GEMFILE: ${{ inputs.base-gemfile }}
      run: ruby tasks/installed_bundle_cache_cli.rb prepare-partitioned-groups --base-gemfile "$BASE_GEMFILE" --groups /tmp/ddtrace-installed-bundle-groups.json --base-bundle-path /tmp/ddtrace-installed-base-bundle --validation-path /tmp/ddtrace-installed-bundle-validation --jobs 8
    - id: population-duration
      if: steps.lifecycle.outputs.generation-needed == 'true'
      shell: bash
      env:
        START_SECONDS: ${{ steps.population-start.outputs.seconds }}
      run: echo "seconds=$(($(date +%s) - START_SECONDS))" >> "$GITHUB_OUTPUT"
    - id: save-start
      if: steps.lifecycle.outputs.generation-needed == 'true'
      shell: bash
      run: echo "seconds=$(date +%s)" >> "$GITHUB_OUTPUT"
    - name: Save standard-0 installed bundle
      if: steps.lifecycle.outputs.generation-needed == 'true' && steps.lookup-standard-0.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        key: ${{ steps.manifest.outputs.standard-0-key }}
        path: ${{ steps.manifest.outputs.standard-0-paths }}
    - name: Save standard-1 installed bundle
      if: steps.lifecycle.outputs.generation-needed == 'true' && steps.lookup-standard-1.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        key: ${{ steps.manifest.outputs.standard-1-key }}
        path: ${{ steps.manifest.outputs.standard-1-paths }}
    - name: Save standard-2 installed bundle
      if: steps.lifecycle.outputs.generation-needed == 'true' && steps.lookup-standard-2.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        key: ${{ steps.manifest.outputs.standard-2-key }}
        path: ${{ steps.manifest.outputs.standard-2-paths }}
    - name: Save standard-3 installed bundle
      if: steps.lifecycle.outputs.generation-needed == 'true' && steps.lookup-standard-3.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        key: ${{ steps.manifest.outputs.standard-3-key }}
        path: ${{ steps.manifest.outputs.standard-3-paths }}
    - name: Save standard-4 installed bundle
      if: steps.lifecycle.outputs.generation-needed == 'true' && steps.lookup-standard-4.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        key: ${{ steps.manifest.outputs.standard-4-key }}
        path: ${{ steps.manifest.outputs.standard-4-paths }}
    - name: Save standard-5 installed bundle
      if: steps.lifecycle.outputs.generation-needed == 'true' && steps.lookup-standard-5.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        key: ${{ steps.manifest.outputs.standard-5-key }}
        path: ${{ steps.manifest.outputs.standard-5-paths }}
    - name: Save standard-6 installed bundle
      if: steps.lifecycle.outputs.generation-needed == 'true' && steps.lookup-standard-6.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        key: ${{ steps.manifest.outputs.standard-6-key }}
        path: ${{ steps.manifest.outputs.standard-6-paths }}
    - name: Save misc-0 installed bundle
      if: steps.lifecycle.outputs.generation-needed == 'true' && steps.lookup-misc-0.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        key: ${{ steps.manifest.outputs.misc-0-key }}
        path: ${{ steps.manifest.outputs.misc-0-paths }}
    - id: save-duration
      if: steps.lifecycle.outputs.generation-needed == 'true'
      shell: bash
      env:
        START_SECONDS: ${{ steps.save-start.outputs.seconds }}
      run: echo "seconds=$(($(date +%s) - START_SECONDS))" >> "$GITHUB_OUTPUT"
    - id: result
      shell: bash
      env:
        BASE_MISSING: ${{ steps.lifecycle.outputs.base-missing }}
        GENERATION_NEEDED: ${{ steps.lifecycle.outputs.generation-needed }}
        WRITE_ENABLED: ${{ inputs.write-enabled }}
      run: |
        status=deferred
        if [ "$WRITE_ENABLED" = "true" ]; then
          status=exact
          if [ "$BASE_MISSING" = "true" ] || [ "$GENERATION_NEEDED" = "true" ]; then
            status=generated
          fi
        fi
        echo "status=$status" >> "$GITHUB_OUTPUT"
