issuer: https://token.actions.githubusercontent.com

# Caller: libddwaf-rb's notify-consumers.yml, run manually after a gem
# release. Pinned to main so only the reviewed workflow definition on main can
# mint this contents:write token -- do not relax to another ref pattern.
subject_pattern: "repo:DataDog/libddwaf-rb:ref:refs/heads/main"

claim_pattern:
  event_name: workflow_dispatch
  repository: DataDog/libddwaf-rb
  job_workflow_ref: DataDog/libddwaf-rb/\.github/workflows/notify-consumers\.yml@refs/heads/main

permissions:
  contents: write
