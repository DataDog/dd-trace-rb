issuer: https://token.actions.githubusercontent.com

# Caller: libddwaf-rb's notify-consumers.yml, run manually after a local gem
# release. Pinned to master (the repo's default branch) so only the reviewed
# workflow definition on master can mint this contents:write token -- do not
# relax to another ref pattern.
subject_pattern: "repo:DataDog/libddwaf-rb:ref:refs/heads/master"

claim_pattern:
  event_name: workflow_dispatch
  repository: DataDog/libddwaf-rb
  job_workflow_ref: DataDog/libddwaf-rb/\.github/workflows/notify-consumers\.yml@refs/heads/master

permissions:
  contents: write
