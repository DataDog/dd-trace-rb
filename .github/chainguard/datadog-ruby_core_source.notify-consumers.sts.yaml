issuer: https://token.actions.githubusercontent.com

# Caller: datadog-ruby_core_source's notify-consumers job, appended to
# publish.yml and gated on its publish job (trusted-publishing release,
# manually dispatched on main). Pinned to main so only the reviewed workflow
# definition on main can mint this contents:write token -- do not relax to
# another ref pattern.
subject_pattern: "repo:DataDog/datadog-ruby_core_source:ref:refs/heads/master"

claim_pattern:
  event_name: workflow_dispatch
  repository: DataDog/datadog-ruby_core_source
  job_workflow_ref: DataDog/datadog-ruby_core_source/\.github/workflows/publish\.yml@refs/heads/main

permissions:
  contents: write
