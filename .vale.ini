StylesPath = vale/styles
MinAlertLevel = error

[*.md]
BasedOnStyles = Changelog, write-good, proselint, Harper

# Calibrated against the 13 GitHub releases cut by the primary release
# manager, v2.0.0 and later (140 unique messages): EndPunctuation fires
# 139 times (the old convention ended entries without terminal
# punctuation -- the delta is the rule's point), NoCatchalls fires twice
# on real "and more" tails, and every other gate is silent on that corpus.
# These package rules collide with this domain's vocabulary or genre:
write-good.E-Prime = NO # "is"/"are" are legitimate in technical messages
write-good.Passive = NO # when-clauses use passive naturally ("when X is enabled")

# The vague-words ban gates: changelog messages must make specific claims.
write-good.Weasel = error

# Harper is silent on the same corpus at every level, so it gates as-is.
# Its package grades the subject/verb number disagreement family at
# warning, which MinAlertLevel above never gates, so promote it: agreement
# errors are the grammar mistakes worth failing a PR for.
Harper.ThereIsAgreement = error
Harper.ThereIsAgreementContracted = error
Harper.ThereIsAgreementInverted = error
Harper.ThereIsAgreementInvertedPast = error
Harper.ThereIsAgreementPluralBe = error
Harper.ThereIsAgreementPluralBeInverted = error
