// Subset of spec/datadog/profiling/pprof/pprof.proto, inlined so these fragments
// can be generated without the full schema. Keep field numbers and types aligned
// with the original so concatenated fragments decode as a single Profile.
// "Fragment" names a message containing only part of Profile's fields, usually
// one entry of a repeated field. Encode each fragment as a raw protobuf message
// and concatenate the bytes to form one Profile; no enclosing message is needed.

syntax = "proto3";

package miteruby_pprof;

message FragmentSampleType {
  message ValueType {
    int64 type = 1;
    int64 unit = 2;
  }

  // Corresponds to Profile.sample_type in pprof.proto
  ValueType sample_type = 1;
}

message FragmentSample {
  message Sample {
    message Label {
      int64 key = 1;
      int64 str = 2;
      int64 num = 3;
      // Not currently needed for Ruby profiler
      // int64 num_unit = 4;
    }

    repeated uint64 location_id = 1 [packed = true];
    repeated int64 value = 2 [packed = true];
    repeated Label label = 3;
  }

  // Corresponds to Profile.sample in pprof.proto
  Sample sample = 2;
}

// Not currently needed for Ruby profiler
// message FragmentMapping {
//   message Mapping {
//     uint64 id = 1;
//     uint64 memory_start = 2;
//     uint64 memory_limit = 3;
//     uint64 file_offset = 4;
//     int64 filename = 5;
//     int64 build_id = 6;
//     bool has_functions = 7;
//     bool has_filenames = 8;
//     bool has_line_numbers = 9;
//     bool has_inline_frames = 10;
//   }
//
//   // Corresponds to Profile.mapping in pprof.proto
//   Mapping mapping = 3;
// }

message FragmentLocation {
  message Location {
    message Line {
      uint64 function_id = 1;
      int64 line = 2;
    }

    uint64 id = 1;
    // Not currently needed for Ruby profiler
    // uint64 mapping_id = 2;
    // uint64 address = 3;
    // Multiple inline-frame records are not currently needed for Ruby profiler.
    // repeated Line line = 4;
    // Ruby emits one Line per Location; a singular field preserves its wire encoding.
    Line line = 4;
    // Not currently needed for Ruby profiler
    // bool is_folded = 5;
  }

  // Corresponds to Profile.location in pprof.proto
  Location location = 4;
}

message FragmentFunction {
  message Function {
    uint64 id = 1;
    int64 name = 2;
    // Not currently needed for Ruby profiler
    // int64 system_name = 3;
    int64 filename = 4;
    // Not currently needed for Ruby profiler
    // int64 start_line = 5;
  }

  // Corresponds to Profile.function in pprof.proto
  Function function = 5;
}

message FragmentStringTable {
  // Corresponds to Profile.string_table in pprof.proto
  // Emit one element per fragment; repeated preserves the empty string at index zero.
  repeated string string_table = 6;
}

// Profile fields that don't need separate encoding can be emitted together once per profile.
message FragmentProfile {
  // Not currently needed for Ruby profiler
  // message ValueType {
  //   int64 type = 1;
  //   int64 unit = 2;
  // }

  // Not currently needed for Ruby profiler
  // Corresponds to Profile.drop_frames in pprof.proto
  // int64 drop_frames = 7;
  // Corresponds to Profile.keep_frames in pprof.proto
  // int64 keep_frames = 8;
  // Corresponds to Profile.time_nanos in pprof.proto
  int64 time_nanos = 9;
  // Corresponds to Profile.duration_nanos in pprof.proto
  int64 duration_nanos = 10;
  // Not currently needed for Ruby profiler
  // Corresponds to Profile.period_type in pprof.proto
  // ValueType period_type = 11;
  // Corresponds to Profile.period in pprof.proto
  // int64 period = 12;
  // Corresponds to Profile.comment in pprof.proto
  // repeated int64 comment = 13 [packed = true];
  // Corresponds to Profile.default_sample_type in pprof.proto
  // int64 default_sample_type = 14;
}
